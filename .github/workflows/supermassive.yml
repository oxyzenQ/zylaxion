            ~/.cargo/git
            target
          key: ${{ runner.os }}-supermassive-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-supermassive-release-
            ${{ runner.os }}-supermassive-

      - name: Build the exact release shape (night-improve-11 alias)
        run: cargo pro-linux-amd64-gnu --locked

      # night-dinner-4 + night-dinner-5: the build's own refresh hook
      # keeps the prebuilt lane in step with the ebpf/ tree; the verdict
      # below pins that a release-shape build never leaves the lane
      # behind (the beta.1 incident shape, asserted in CI).
      - name: The prebuilt lane is in parity after the build
        run: ./scripts/dev/regenerate-ebpf-prebuilt.sh --check

      - name: Binary identity and hardware-free surfaces
        run: |
          BIN="target/x86_64-unknown-linux-gnu/release/zylaxion"
          file "${BIN}"
          ldd "${BIN}" || true
          du -h "${BIN}"
          echo "--- zylaxion -V ---"
          "${BIN}" -V
          echo "--- zylaxion -h (first 20 lines) ---"
          "${BIN}" -h | head -20

  claims:
    name: supermassive lane - the claims (rootless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # The apt stall class (the run 40291698597 lineage, still live
          # through e0e1fdd: every compile lane died exit-124 inside
          # 'apt-get update' — the index refresh fans out to a dozen
          # archive hosts and one trickling mirror stalls the whole
          # step). The shape now skips the fan-out in the common case:
          # the runner image ships package lists ~10 days fresh, so the
          # fast path installs directly (one host, a few small debs,
          # Retries=5 + per-session Timeout=45). Only a failed install
          # earns the update, and the update earns three named attempts
          # (the download_deb doctrine): each inside its own kill
          # timer, the -qq veil lifted so the log shows the Hit:/Get:
          # lines between attempts. libasound2-dev is the real payload
          # (night-badas-4: cpal's alsa-sys resolves alsa.pc via
          # pkg-config); pkg-config rides preinstalled on both runner
          # images and costs no fetch.
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=45"
          if sudo timeout 300 apt-get $APT_OPTS install -y -qq \
              libasound2-dev pkg-config; then
            echo "apt: the fast path landed (the image's lists held)"
          else
            echo "apt: the fast path failed - the update lane, three named attempts"
            landed=""
            for attempt in 1 2 3; do
              echo "--- apt attempt $attempt: update + install ---"
              if sudo timeout 240 apt-get $APT_OPTS update \
                && sudo timeout 600 apt-get $APT_OPTS install -y -qq \
                     libasound2-dev pkg-config; then
                landed="attempt $attempt"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::apt stalled on all three named attempts"
                exit 1
              fi
              sleep 20
            done
            echo "apt: landed on $landed"
          fi

      - name: Compute the build-prerequisites cache key
        id: prereq
        run: |
          # Both toolchain pins and the bootstrap script fold into one
          # hash, so the tools cache can never serve a stale pin.
          echo "key=${{ hashFiles('**/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the build-prerequisites cache (the pinned toolchains + the bootstrap bins)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/bin
            ~/.local/bin
          key: ${{ runner.os }}-supermassive-tools-${{ steps.prereq.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-supermassive-tools-

      - name: Install pinned toolchain (rust-toolchain.toml governs)
        run: rustup show active-toolchain

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-supermassive-claims-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-supermassive-claims-
            ${{ runner.os }}-supermassive-

      - name: Build the exact release shape (night-improve-11 alias)
        run: cargo pro-linux-amd64-gnu --locked

      - name: The prebuilt lane is in parity after the build
        run: ./scripts/dev/regenerate-ebpf-prebuilt.sh --check

      # night-master-1: the claims battery, rootless, on the exact
      # release shape — its own lane since the split (the probes are
      # pure stdlib, so the same battery also rides inside the
      # micro-VM's full lane in supermassive-e2e.yml).
      - name: The claims battery (rootless self-test lane)
        run: |
          set -o pipefail
          ./scripts/supermassive/supermassive-test.sh --self-test \
            --binary target/x86_64-unknown-linux-gnu/release/zylaxion \
            2>&1 | tee /tmp/claims.log

      - name: Claims inventory (the step summary)
        if: always()
        run: |
          {
            echo "## supermassive — the claims (rootless)"
            echo
            echo '```'
            grep -E '^MASS-(RESULT|VERDICT)' /tmp/claims.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── night-arm-1: the arm64 server proof lane ──────────────────────────
  # The owner's arm64 mandate: zylaxion must run on modern ARM64
  # servers. This lane builds the `cargo pro-native-arm64-gnu` alias
  # on the free native arm64 runner (ubuntu-24.04-arm — no QEMU, no
  # cross-compile: the silicon IS the target, so target-cpu=native is
  # honest and the glibc the binary links is the runner's own). The
  # lane mirrors the release-shape lane's structure (the same
  # bootstrap-ebpf.sh pair, the same cache shape) and adds the arm64
  # target to rustup, then proves the binary's build identity and
  # hardware-free surfaces (-V, -h) the same way release-shape does.
  #
  # The release matrix (release.yml) stays x86_64-only: an arm64
  # cross-build from an x86 runner cannot honor the glibc parity the
  # release contract pins, and bumping the release matrix is the
  # owner's call. This lane is the CI proof that the arm64 alias and
  # profile hold; arm64 server operators run the alias directly.
  arm64-native:
    name: supermassive lane - arm64 server (pro-native-arm64-gnu)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # The apt stall class (the run 40291698597 lineage, still live
          # through e0e1fdd: every compile lane died exit-124 inside
          # 'apt-get update' — the index refresh fans out to a dozen
          # archive hosts and one trickling mirror stalls the whole
          # step). The shape now skips the fan-out in the common case:
          # the runner image ships package lists ~10 days fresh, so the
          # fast path installs directly (one host, a few small debs,
          # Retries=5 + per-session Timeout=45). Only a failed install
          # earns the update, and the update earns three named attempts
          # (the download_deb doctrine): each inside its own kill
          # timer, the -qq veil lifted so the log shows the Hit:/Get:
          # lines between attempts. libasound2-dev is the real payload
          # (night-badas-4: cpal's alsa-sys resolves alsa.pc via
          # pkg-config); pkg-config rides preinstalled on both runner
          # images and costs no fetch.
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=45"
          if sudo timeout 300 apt-get $APT_OPTS install -y -qq \
              libasound2-dev pkg-config; then
            echo "apt: the fast path landed (the image's lists held)"
          else
            echo "apt: the fast path failed - the update lane, three named attempts"
            landed=""
            for attempt in 1 2 3; do
              echo "--- apt attempt $attempt: update + install ---"
              if sudo timeout 240 apt-get $APT_OPTS update \
                && sudo timeout 600 apt-get $APT_OPTS install -y -qq \
                     libasound2-dev pkg-config; then
                landed="attempt $attempt"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::apt stalled on all three named attempts"
                exit 1
              fi
              sleep 20
            done
            echo "apt: landed on $landed"
          fi

      - name: Add the arm64 gnu target to rustup
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Compute the build-prerequisites cache key
        id: prereq
        run: |
          # Both toolchain pins and the bootstrap script fold into one
          # hash, so the tools cache can never serve a stale pin.
          echo "key=${{ hashFiles('**/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the build-prerequisites cache (the pinned toolchains + the bootstrap bins)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/bin
            ~/.local/bin
          key: ${{ runner.os }}-arm64-supermassive-tools-${{ steps.prereq.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-arm64-supermassive-tools-

      - name: Install pinned toolchain (rust-toolchain.toml governs)
        run: rustup show active-toolchain

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-arm64-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-arm64-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-supermassive-native-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-supermassive-native-

      - name: Build the arm64 native shape (pro-native-arm64-gnu alias)
        run: cargo pro-native-arm64-gnu --locked

      # night-dinner-4 + night-dinner-5: the prebuilt parity pin rides
      # here too — an arm64 build must leave the prebuilt lane in step
      # with the ebpf/ tree it shipped from.
      - name: The prebuilt lane is in parity after the build
        run: ./scripts/dev/regenerate-ebpf-prebuilt.sh --check

      - name: Binary identity and hardware-free surfaces
        run: |
