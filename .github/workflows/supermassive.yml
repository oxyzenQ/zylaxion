        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-supermassive-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-supermassive-integration-
            ${{ runner.os }}-supermassive-

      - name: Integration battery (the tests target class, all features)
        run: cargo test --tests --all-features

