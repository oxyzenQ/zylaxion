# =============================================================================
# SUPERMASSIVE — the deep battery, the hosted lanes (night-ci-split-1).
# =============================================================================
#
# night-ci-split-1 (the owner's five-minute law): the former four
# monolithic jobs — the 30/20/25-minute test battery, release shape,
# claims, and the KVM floor that rode in this same file — are split
# into two files of many small lanes. THIS file holds the hosted
# lanes; the micro-VM floor moved to supermassive-e2e.yml. Each lane
# is engineered to a five-minute warm target: the shared
# build-prerequisites cache (the pinned toolchains, bpf-linker, b3sum)
# removes the per-lane bootstrap cost, and each lane's cargo cache
# falls back through restore-keys to the estate-wide supermassive
# prefix, so a fresh lane warms from the last run of any sibling. The
# timeout-minutes lines stay what they always were in this estate —
# fail-fast lines sized to the measured cold records, not a speed
# claim; the five-minute number is the warm engineering target, and a
# cold cache miss is allowed to buy its compile honestly.
#
# History: night-improve-7 named the battery; night-dragon-maintenance-2
# retired the weekly clock AND the surface globs — every push burns the
# deep battery, no path filter, no branch filter, the same blind
# posture every push-triggered lane in the estate now carries.
# workflow_dispatch stays for the on-demand deep run, and the
# concurrency group rides the workflow name so a fresh push never
# stacks on a running battery. No pull_request trigger on purpose:
# the fast lane (ci.yml) owns PR verdicts.
#
# Honest physics of a sound keyboard in CI: there is no audio device and no
# input device on a runner. What the battery therefore proves — and proves
# deeply, on the pinned toolchain, not a floating one:
#   - the full test surface of the unified package, every target class
#     that exists (the package is binary-only — bins, tests, examples,
#     benches; the lib and doc-test classes do not exist here) and
#     every feature combination (the Zactrix
#     engine's procedural synthesis, profile math, orchestrator wiring,
#     CLI/config/daemon unit contracts are pure computation and run
#     headless by design);
#   - the documentation build with warnings denied;
#   - the exact release shape (the `cargo pro-linux-amd64-gnu` alias, the
#     release workflow's build contract verbatim) plus the binary's
#     hardware-free surfaces: -V (build identity) and -h (the branded help
#     render), the same surfaces the README demo asset was captured from;
#   - the claims battery, rootless, on the exact release shape (its own
#     lane since the split).
# What it cannot prove and does not claim: real ALSA output timing and real
# libinput event flow — those need hardware and stay the owner's desktop
# verification; the kernel-span proof lives in supermassive-e2e.yml.
#
# Toolchain: no rustup override anywhere — rust-toolchain.toml's 1.98.1 pin
# governs every cargo invocation, so the battery always tests the exact
# toolchain the MSRV contract promises.
#
# Action pins: release-commit SHAs with version tokens, the night-improve-8
# estate — kept current by scripts/gates/check-actions-pins.sh.

---
name: Dragon Guard - Supermassive

"on":
  push:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: supermassive lane - formatting gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          # night-dragon-maintenance-6: the checkout token never
          # outlives this step — no later step can read it back.
          persist-credentials: false

      - name: Install pinned toolchain (rust-toolchain.toml governs)
        run: rustup show active-toolchain

      - name: Formatting gate
        run: cargo fmt --all -- --check

  test-units:
    name: supermassive lane - unit battery (the bin crate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # The apt stall class (the run 40291698597 lineage, still live
          # through e0e1fdd: every compile lane died exit-124 inside
          # 'apt-get update' — the index refresh fans out to a dozen
          # archive hosts and one trickling mirror stalls the whole
          # step). The shape now skips the fan-out in the common case:
          # the runner image ships package lists ~10 days fresh, so the
          # fast path installs directly (one host, a few small debs,
          # Retries=5 + per-session Timeout=45). Only a failed install
          # earns the update, and the update earns three named attempts
          # (the download_deb doctrine): each inside its own kill
          # timer, the -qq veil lifted so the log shows the Hit:/Get:
          # lines between attempts. libasound2-dev is the real payload
          # (night-badas-4: cpal's alsa-sys resolves alsa.pc via
          # pkg-config); pkg-config rides preinstalled on both runner
          # images and costs no fetch.
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=45"
          if sudo timeout 300 apt-get $APT_OPTS install -y -qq \
              libasound2-dev pkg-config; then
            echo "apt: the fast path landed (the image's lists held)"
          else
            echo "apt: the fast path failed - the update lane, three named attempts"
            landed=""
            for attempt in 1 2 3; do
              echo "--- apt attempt $attempt: update + install ---"
              if sudo timeout 240 apt-get $APT_OPTS update \
                && sudo timeout 600 apt-get $APT_OPTS install -y -qq \
                     libasound2-dev pkg-config; then
                landed="attempt $attempt"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::apt stalled on all three named attempts"
                exit 1
              fi
              sleep 20
            done
            echo "apt: landed on $landed"
          fi

      - name: Compute the build-prerequisites cache key
        id: prereq
        run: |
          # Both toolchain pins and the bootstrap script fold into one
          # hash, so the tools cache can never serve a stale pin.
          echo "key=${{ hashFiles('**/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the build-prerequisites cache (the pinned toolchains + the bootstrap bins)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/bin
            ~/.local/bin
          key: ${{ runner.os }}-supermassive-tools-${{ steps.prereq.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-supermassive-tools-

      - name: Install pinned toolchain (rust-toolchain.toml governs)
        run: rustup show active-toolchain

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-supermassive-lib-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-supermassive-lib-
            ${{ runner.os }}-supermassive-

      # The package is binary-only (the module tree wires into
      # main.rs — there is no [lib] target, so --lib and --doc have
      # nothing to select and would error). The bin target's unit
      # tree IS the unit battery.
      - name: Unit battery (the bin crate, all features)
        run: cargo test --bins --all-features

