# =============================================================================
# SUPERMASSIVE — the deep battery (night-improve-7, owner-approved until
# peak LTS; the name and the seat are the zelynic lineage).
# =============================================================================
#
# night-dragon-maintenance-2 (the owner's unfiltered-CI
# simplification, the zejtron estate's mature shape): the weekly
# clock is gone (night-badas-2) AND the surface globs are gone —
# every push burns the deep battery, no path filter, no branch
# filter, the same blind posture every push-triggered lane in the
# estate now carries. The former trigger spelling ('**/*.rs',
# '**/*.toml', '**/Cargo.lock', '.cargo/**', 'ebpf/**', 'scripts/**'
# plus this file's own name — the zelynic boost-10 one-spelling law)
# retired with the rest: the estate-wide spelling's sync tax across
# every build workflow cost more than the runner minutes it saved,
# and a deep battery that can be blinded by a change its globs never
# named is a battery the estate cannot trust. workflow_dispatch
# stays for the on-demand deep run, and the concurrency group rides
# the workflow name so a fresh push never stacks on a running
# battery. No pull_request trigger on purpose: the fast lane
# (ci.yml) owns PR verdicts.
#
# night-master-3 adds the THIRD seat, the one this workflow could never
# hold before: the real-usage E2E on the KVM micro-VM floor (the
# zelynic supermassive lineage's crown job, ported to zylaxion's
# claims). The hosted jobs above prove the headless surfaces; the
# e2e-vm job boots a real kernel in a micro-VM (direct kernel boot,
# initramfs rootfs, /dev/kvm on the runner) and runs the WHOLE
# zero-to-hero chain inside it: install the payload to /usr/bin, walk
# the tap lifecycle (attach, the pin handover, the idempotency and
# foreign-entry classifications, detach), then the crown stage — a
# real user in NO input group turns the sound on, a uinput virtual
# keyboard types through the kernel's own input path, the eBPF tap
# counts every press kernel-side, and snd-dummy's PCM state witnesses
# the synthesizer rendering real frames. Two legs cross the kernel
# span: the documented 5.15 floor (jammy's 5.15.0 line) and the newest
# kernel the archive serves the runner's own distro. The verdict relay
# is the zelynic sentinel contract: the guest's init
# (scripts/ci/supermassive-init.sh) and the engine
# (scripts/supermassive/supermassive-test.py) print MASS-RESULT rows
# plus one final MASS-VERDICT line on the serial console; the Verdict
# step greps them (a VM cannot pass exit codes through qemu).
#
# Honest physics of a sound keyboard in CI: there is no audio device and no
# input device on a runner. What the battery therefore proves — and proves
# deeply, on the pinned toolchain, not a floating one:
#   - the full test surface of all six workspace crates, every target class
#     (lib, bins, tests, examples, benches) and every feature combination
#     (the Zactrix engine's procedural synthesis, profile math, orchestrator
#     wiring, CLI/config/daemon unit contracts are pure computation and run
#     headless by design);
#   - the documentation build with warnings denied;
#   - the exact release shape (the `cargo pro-linux-amd64-gnu` alias, the
#     release workflow's build contract verbatim) plus the binary's
#     hardware-free surfaces: -V (build identity) and -h (the branded help
#     render), the same surfaces the README demo asset was captured from.
# What it cannot prove and does not claim: real ALSA output timing and real
# libinput event flow — those need hardware and stay the owner's desktop
# verification.
#
# Toolchain: no rustup override anywhere — rust-toolchain.toml's 1.98.1 pin
# governs every cargo invocation, so the battery always tests the exact
# toolchain the MSRV contract promises.
#
# Action pins: release-commit SHAs with version tokens, the night-improve-8
# estate — kept current by scripts/gates/check-actions-pins.sh.

---
name: Dragon Guard - Supermassive

"on":
  push:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-battery:
    name: supermassive test - full battery (pinned toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          # night-dragon-maintenance-6: the checkout token never
          # outlives this step — no later step can read it back.
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # The archive-mirror kill timers (the run 40291698597 stall
          # class, closed on every door of this workflow): a trickling
          # mirror dies loudly inside its budget, never a silent burn.
          sudo timeout 240 apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=45 update -qq
          sudo timeout 600 apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=45 install -y -qq \
            libasound2-dev pkg-config

      - name: Install pinned toolchain (rust-toolchain.toml governs)
        run: rustup show active-toolchain

      # night-badas-1: the ebpf feature went default in night-improve-23,
      # so every git-checkout build (test, doc, release shape) source-builds
      # the kernel object through build.rs and hard-requires the dated
      # nightly pin + bpf-linker — this lane never had them and died in
      # the build script's preflight. The bootstrap is the canonical
      # installer, the same pair the ci.yml check lane runs.
      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-supermassive-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-supermassive-

      - name: Formatting gate
        run: cargo fmt --all -- --check

      - name: Full test battery (all targets, all features)
        run: cargo test --workspace --all-targets --all-features

      - name: Documentation build, warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

  release-shape:
    name: supermassive test - release shape proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          # night-dragon-maintenance-6: the checkout token never
          # outlives this step — no later step can read it back.
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # The archive-mirror kill timers (the run 40291698597 stall
          # class, closed on every door of this workflow): a trickling
          # mirror dies loudly inside its budget, never a silent burn.
          sudo timeout 240 apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=45 update -qq
          sudo timeout 600 apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=45 install -y -qq \
            libasound2-dev pkg-config

      - name: Install pinned toolchain (rust-toolchain.toml governs)
        run: rustup show active-toolchain

      # night-badas-1: the release shape proof builds the same default
      # feature set, so the eBPF source-build prerequisites ride here
      # too — the same cache + bootstrap pair as the battery job.
      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-supermassive-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-supermassive-release-

      - name: Build the exact release shape (night-improve-11 alias)
        run: cargo pro-linux-amd64-gnu --locked

      # night-dinner-4 + night-dinner-5: the build's own refresh hook
      # keeps the prebuilt lane in step with the ebpf/ tree; the verdict
      # below pins that a release-shape build never leaves the lane
      # behind (the beta.1 incident shape, asserted in CI).
      - name: The prebuilt lane is in parity after the build
        run: ./scripts/dev/regenerate-ebpf-prebuilt.sh --check

      - name: Binary identity and hardware-free surfaces
        run: |
          BIN="target/x86_64-unknown-linux-gnu/release/zylaxion"
          file "${BIN}"
          ldd "${BIN}" || true
          du -h "${BIN}"
          echo "--- zylaxion -V ---"
          "${BIN}" -V
          echo "--- zylaxion -h (first 20 lines) ---"
          "${BIN}" -h | head -20

  # ═══════════════════════════════════════════════════════════════════
  # night-master-1: the claims battery, rootless, on the
  # exact release shape. The extraordinary claims get their own
  # independent verification lane: pure-math synthesis (no decoder is
  # linked — the process physically cannot play a sample), the eBPF
  # tap shipped as an embedded ELF-BPF object targeting input_event,
  # and the no-daemon/no-bloat posture (zero config/pidfile/socket
  # strings, zero daemon-era crates transitively in Cargo.lock). The
  # probes are pure stdlib (a hand-rolled ELF64 DT_NEEDED parser — no
  # readelf/ldd dependency) so the same battery also rides inside the
  # micro-VM's full lane. The release shape is built with the same
  # cache + bootstrap pair the release-shape job uses.
  # ═══════════════════════════════════════════════════════════════════
  claims:
    name: supermassive test - the claims (rootless)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          # night-dragon-maintenance-6: the checkout token never
          # outlives this step — no later step can read it back.
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # The archive-mirror kill timers (the run 40291698597 stall
          # class, closed on every door of this workflow): a trickling
          # mirror dies loudly inside its budget, never a silent burn.
          sudo timeout 240 apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=45 update -qq
          sudo timeout 600 apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=45 install -y -qq \
            libasound2-dev pkg-config

      - name: Install pinned toolchain (rust-toolchain.toml governs)
        run: rustup show active-toolchain

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-supermassive-claims-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-supermassive-claims-

      - name: Build the exact release shape (night-improve-11 alias)
        run: cargo pro-linux-amd64-gnu --locked

      # night-dinner-4 + night-dinner-5: the build's own refresh hook
      # keeps the prebuilt lane in step with the ebpf/ tree; the verdict
      # below pins that a release-shape build never leaves the lane
      # behind (the beta.1 incident shape, asserted in CI).
      - name: The prebuilt lane is in parity after the build
        run: ./scripts/dev/regenerate-ebpf-prebuilt.sh --check

      - name: The claims battery (rootless self-test lane)
        run: |
          set -o pipefail
          ./scripts/supermassive/supermassive-test.sh --self-test \
            --binary target/x86_64-unknown-linux-gnu/release/zylaxion \
            2>&1 | tee /tmp/claims.log

      - name: Claims inventory (the step summary)
        if: always()
        run: |
          {
            echo "## supermassive — the claims (rootless)"
            echo
            echo '```'
            grep -E '^MASS-(RESULT|VERDICT)' /tmp/claims.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════
  # night-master-3: the real-usage E2E on the KVM micro-VM floor.
  # Three legs cross the kernel span (night-dragon-maintenance-4:
  # below the floor, the focal 5.4 refusal witness; the documented
  # 5.15 floor, jammy's 5.15.0 line; the newest kernel the archive
  # serves); the battery inside is the same whole-chaos engine, and
  # the below-floor leg runs the refusal walk instead. The envelope
  # derives from the
  # runner at boot (the zelynic dynamic doctrine — never pin one
  # era's hardware): the best leg takes every core and three quarters
  # of the RAM; the floor leg takes the LOW envelope (one quarter of
  # the cores floored at 1, one eighth of the RAM floored at 1024 MB)
  # — night-dragon-maintenance-2's audit: low specs is BOTH axes, the
  # minimum kernel AND the small machine.
  #
  # night-dragon-maintenance-2 deepens the leg twice, the owner's
  # asks: (1) the from-source law — the payload is built with the
  # `cargo pro-linux-amd64-v3-gnu` alias (the amd64-v3 shape the
  # release matrix ships), never a bare `cargo build --release`; the
  # VM boots KVM's -cpu host passthrough, so the guest CPU is the
  # runner's own and the v3 codegen is honest inside it. (2) the
  # realtime depth stresstest — the engine's storm stage (the zejtron
  # storm lineage) rides the --full battery: two concurrent uinput
  # writers hammer the kernel's input path while the telemetry polls
  # must RISE mid-storm and the whole volume boundary lattice is
  # asserted UNDER LOAD, the PCM witness read while the writers still
  # run — verdicts under load, never after it.
  # ═══════════════════════════════════════════════════════════════════
  e2e-vm:
    name: ${{ matrix.leg.title }}
    runs-on: ubuntu-24.04
    # Sized to the measured records, not inherited (the zelynic
    # timeout doctrine: not a speed claim — a fail-fast line). The
    # healthy leg's wall clock is ~5-12 min (build + rootfs + the
    # guest's few-minute battery); every archive transaction below
    # now carries its own kill timer, the guest's qemu phase is
    # capped at 900 s, so 30 is the last-resort line that catches a
    # wedged runner node — the 40 it replaces let the run
    # 40291698597 incident burn 26 idle minutes in one apt download.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # night-badas-5: the leg titles ride the zelynic supermassive
        # lineage's low/best specs shape. night-dragon-maintenance-2's
        # audit sharpened both ends: the floor leg boots the REAL
        # minimum (the jammy GA release-day 5.15.0 kernel, the jammy
        # main pocket only) on the LOW envelope (quarter cores /
        # eighth RAM, floored) — low specs on BOTH axes, the kernel and
        # the machine; the best leg boots the archive's head on the
        # full envelope. Each spec tier is one gnu leg — glibc is the
        # only libc the matrix ships.
        # night-dragon-maintenance-4 adds the third seat, the zejtron
        # kernel-witnesses lineage's refusal direction: the below-floor
        # leg boots the focal 5.4 GA kernel (BELOW the documented
        # floor) on the LOW envelope and proves the refusal walk —
        # doctor, attach, and on must all refuse honestly naming the
        # 5.15 minimum, the direction every at/above kernel leg can
        # only compute, never exercise.
        leg:
          - title: supermassive test - low specs (the 5.15 documented floor)
            pocket: floor
          - title: supermassive test - best specs (the archive's head)
            pocket: latest
          - title: supermassive test - below the floor (the 5.4 refusal witness)
            pocket: below-floor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          # night-dragon-maintenance-6: the checkout token never
          # outlives this step — no later step can read it back.
          persist-credentials: false

      # The zelynic doctrine, verbatim: /dev/kvm is a GitHub runner
      # guarantee, but the node ships 0660 root:kvm — the job opens it
      # up itself. Failing LOUDLY beats a confusing TCG fallback: the
      # release-shape binary is native codegen and would SIGILL under
      # TCG's -cpu qemu64 — KVM's -cpu host passthrough is what makes
      # "native" honest inside the VM.
      - name: Verify KVM
        run: |
          test -e /dev/kvm || {
            echo "FAIL: /dev/kvm is absent — this runner image cannot boot the micro-VM"
            exit 1
          }
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          test -w /dev/kvm || {
            echo "FAIL: /dev/kvm is not usable by the runner user even after chmod"
            ls -l /dev/kvm
            exit 1
          }
          echo "OK: /dev/kvm present and usable"

      - name: Install qemu + cpio + the ALSA build headers
        run: >-
          sudo timeout 240 apt-get -o Acquire::Retries=5
          -o Acquire::http::Timeout=45 update -qq &&
          sudo timeout 600 apt-get -o Acquire::Retries=5
          -o Acquire::http::Timeout=45 install -y
          --no-install-recommends qemu-system-x86 cpio
          libasound2-dev pkg-config

      - name: Install pinned toolchain (rust-toolchain.toml governs)
        run: rustup show active-toolchain

      # The release shape needs the eBPF objects (the default ebpf
      # feature source-builds them): the same cache + bootstrap pair
      # the battery job runs.
      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-supermassive-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-supermassive-e2e-

      # The bring-up half, on the runner: the payload is the release
      # page's amd64-v3 shape, built with the owner's from-source law
      # (night-dragon-maintenance-2): the `cargo pro-linux-amd64-v3-gnu`
      # alias — the exact rustflags the release matrix's v3 leg ships,
      # held by scripts/gates/check-release-parity.sh — never a bare
      # `cargo build --release`. A guest cannot host a Rust toolchain
      # build; the payload crosses as a finished binary. The build
      # needs the ALSA headers on the HOST (night-badas-4: cpal's
      # alsa-sys resolves alsa.pc via pkg-config — the job used to
      # install only qemu + cpio and died in the payload build before
      # the VM ever booted; libasound2 rides the rootfs lane below).
      - name: Build the release v3 shape payload (the from-source law)
        run: cargo pro-linux-amd64-v3-gnu --locked

      # night-dinner-4 + night-dinner-5: the same parity pin the other
      # release-shape lanes carry — the payload's build must leave the
      # prebuilt lane in step with the ebpf/ tree it shipped from.
      - name: The prebuilt lane is in parity after the build
        run: ./scripts/dev/regenerate-ebpf-prebuilt.sh --check

      # ── the guest kernel, per leg ─────────────────────────────────
      # floor: the documented 5.15 floor, the REAL minimum — the
      #   jammy GA release-day image (5.15.0-25), resolved from the
      #   jammy main pocket ONLY. The GA suite is frozen by archive
      #   policy, so the resolution cannot drift with the weekly
      #   jammy-updates ABI bumps — which are deliberately NOT
      #   configured (night-dragon-maintenance-2's audit: the former
      #   resolver picked the NEWEST 5.15.0-x from jammy-updates, the
      #   floor family but not the floor; the owner's law is the
      #   minimum the docs promise, never the newest kernel the
      #   archive still serves under the same minor number). Fails
      #   LOUDLY with the discovery evidence if the pocket ever stops
      #   carrying the floor kernel.
      # latest: the newest kernel the runner's own distro pockets
      #   serve (the zelynic dynamic-resolver doctrine, scoped to the
      #   runner's distro — same userland, the kernel is the leg's
      #   variable).
      # below-floor: the focal 5.4 GA kernel (the zejtron witness
      #   lineage's below-floor seat, verified live there at
      #   5.4.0-26.30), resolved from the focal main pocket ONLY —
      #   the same frozen-GA-suite law, the same fails-loudly law.
      #   The image deb is all this leg fetches: the refusal walk
      #   needs no sound chain and no uinput, the kernel floor gate
      #   fires before any of them could matter.
      - name: Resolve and fetch the guest kernel (${{ matrix.leg.pocket }})
        run: |
          set -euo pipefail
          mkdir -p /tmp/kfloor && cd /tmp/kfloor
          # The archive-mirror stall class, retired (the zelynic curl
          # lesson, the apt edition): EVERY apt transaction below
          # rides an outer kill timer via coreutils timeout - a
          # trickling or wedged fetch dies LOUDLY inside its own
          # budget with the failure named, instead of burning the job
          # budget with zero evidence. The incident this retires: run
          # 40291698597 (2026-10-26), the latest pocket, where the
          # noble modules download crawled past 26 minutes inside
          # this step - Acquire::Retries cannot see a slow-stall (it
          # only sees hard errors), so the outer timer is the honest
          # kill. Acquire::http::Timeout tightens the per-connection
          # stall detection on top. Sized to the measured records
          # (a healthy mirror serves even the 166 MB modules deb in
          # well under a minute), not to optimism.
          if [ "${{ matrix.leg.pocket }}" = "floor" ]; then
            # jammy main ONLY — the GA suite, frozen by archive
            # policy. jammy-updates is deliberately NOT configured:
            # its weekly 5.15.0-x ABI bumps would drag the "floor"
            # leg onto the newest 5.15, and the floor is the MINIMUM.
            echo "deb http://archive.ubuntu.com/ubuntu/ jammy main" \
              | sudo tee /etc/apt/sources.list.d/jammy-floor.list >/dev/null
            sudo timeout 240 apt-get -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=45 update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/jammy-floor.list \
              -o Dir::Etc::sourceparts=/dev/null \
              -o APT::Get::List-Cleanup=0
            PATTERN='linux-image-unsigned-5\.15\.0-[0-9]+-generic'
          elif [ "${{ matrix.leg.pocket }}" = "below-floor" ]; then
            # focal main ONLY — the GA suite, the same frozen-pocket
            # law (the zejtron witness lane rides the same live
            # archive pool; a pocket that stops serving dies loudly
            # here, with the discovery evidence below).
            echo "deb http://archive.ubuntu.com/ubuntu/ focal main" \
              | sudo tee /etc/apt/sources.list.d/focal-below-floor.list >/dev/null
            sudo timeout 240 apt-get -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=45 update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/focal-below-floor.list \
              -o Dir::Etc::sourceparts=/dev/null \
              -o APT::Get::List-Cleanup=0
            PATTERN='linux-image-unsigned-5\.4\.0-[0-9]+-generic'
          else
            sudo timeout 240 apt-get -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=45 update -qq
            PATTERN='linux-image-unsigned-[0-9]+\.[0-9]+\.0-[0-9]+-generic'
          fi
          IMG=$(apt-cache search --names-only "$PATTERN" 2>/dev/null \
            | grep -oE 'linux-image-unsigned-[0-9.]+-[0-9]+-generic' \
            | sort -uV | tail -1 || true)
          if test -z "$IMG"; then
            echo "FAIL: no kernel image resolved for the ${{ matrix.leg.pocket }} pocket"
            apt-cache search --names-only 'linux-image-unsigned' | head -5 || true
            exit 1
          fi
          echo "resolved: $IMG"
          KVER="${IMG#linux-image-unsigned-}"
          # night-dragon-lts: the azure stall class retries at the
          # OUTER layer too. Acquire::Retries sees hard errors, the
          # per-attempt timeout sees a stalled session, and NEITHER
          # re-opens a new connection — a sick mirror day trickles a
          # 166 MB modules deb past any single budget (measured: the
          # image deb alone crawled at 44 kB/s for 6m30s on the run
          # this guard retired). A fresh TCP session usually
          # re-negotiates a healthy path: three attempts, each inside
          # its own kill timer, each death named.
          download_deb() {
            local pkg="$1" attempt
            for attempt in 1 2 3; do
              echo "download attempt $attempt: $pkg"
              if sudo timeout 600 apt-get -o Acquire::Retries=5 \
                  -o Acquire::http::Timeout=45 download "$pkg"; then
                return 0
              fi
              echo "attempt $attempt for $pkg died inside its budget"
            done
            echo "FAIL: $pkg never landed in three attempts"
            return 1
          }
          download_deb "linux-image-unsigned-$KVER"
          # The below-floor leg fetches the image deb ONLY (the
          # refusal walk needs no module chain); every other leg
          # fetches the module set its battery loads.
          if [ "${{ matrix.leg.pocket }}" != "below-floor" ]; then
            download_deb "linux-modules-$KVER"
            # night-badas-4 round 2 (empirical, verified against the
            # archive): the modules-extra split is not universal — jammy's
            # 5.15 ships a 64 MB extra deb while noble's 7.0 carries the
            # whole 166 MB module set in linux-modules alone and the
            # archive refuses the extra name ("Unable to locate package",
            # exit 100). Best-effort by design: ride linux-modules when
            # the extra deb does not exist for the resolved kernel. The
            # same retry guard rides here; a timeout in all attempts
            # reads as the honest note, not a failure - the modules deb
            # above already carries the full set on every kernel that
            # lacks an extra.
            if ! download_deb "linux-modules-extra-$KVER"; then
              echo "note: no linux-modules-extra for $KVER — the modules deb carries the full set"
            fi
          fi
          for deb in linux-image-unsigned-*_amd64.deb linux-modules-*_amd64.deb; do
            [ -e "$deb" ] || continue
            dpkg-deb -x "$deb" pkg
          done
          VMLINUZ=$(find pkg/boot -name 'vmlinuz-*' | head -1)
          test -n "$VMLINUZ" || { echo "FAIL: no vmlinuz in the debs"; ls -la pkg/boot || true; exit 1; }
          cp "$VMLINUZ" /tmp/kfloor/vmlinuz
          # Stage the battery's module chain from the SAME kernel's
          # module trees (same-suite vermagic by construction): the
          # sound core chain (snd-dummy is the PCM witness's card).
          # uinput is NOT in the required set: verified against both
          # reference kernels, jammy's 5.15.0-198 and noble's 7.0.0-38
          # build uinput INTO vmlinuz (modules.builtin carries
          # kernel/drivers/input/misc/uinput.ko in both, no .ko ships
          # in any deb) — a missing uinput.ko is the expected shape,
          # the guest init accepts the built-in. Stage it when the
          # archive does ship one (future series may un-inline it).
          # The below-floor leg stages nothing: its battery is the
          # refusal walk, and the kernel floor gate fires before any
          # module could matter.
          mkdir -p /tmp/kfloor/mods
          if [ "${{ matrix.leg.pocket }}" != "below-floor" ]; then
            for ko in soundcore snd snd-timer snd-pcm snd-dummy; do
              SRC=$(find pkg/lib/modules -name "${ko}.ko*" | head -1)
              test -n "$SRC" || { echo "FAIL: module $ko not in the kernel's module debs"; exit 1; }
              cp "$SRC" /tmp/kfloor/mods/
            done
            UINPUT_KO=$(find pkg/lib/modules -name 'uinput.ko*' | head -1)
            if [ -n "$UINPUT_KO" ]; then
              cp "$UINPUT_KO" /tmp/kfloor/mods/
              echo "uinput: staged from the kernel's module debs"
            elif grep -rq "uinput" pkg/lib/modules/*/modules.builtin 2>/dev/null; then
              echo "uinput: built into the kernel (modules.builtin) — nothing to stage"
            else
              echo "FAIL: uinput neither staged nor built-in — the keystroke injector has no kernel half"
              exit 1
            fi
          else
            echo "below-floor leg: no module chain staged (the refusal walk needs none)"
          fi
          MODS=$(find /tmp/kfloor/mods -maxdepth 1 -type f -printf '%f ')
          echo "kernel: $(du -h /tmp/kfloor/vmlinuz | cut -f1), modules: $MODS"

      # ── the rootfs (ubuntu:24.04 — the runner's own userland, the
      # zelynic gnu-leg doctrine: a dynamically linked payload owes
      # its glibc a same-distro rootfs) ─────────────────────────────
      - name: Assemble the initramfs rootfs
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          # night-dragon-lts: a retried step on the same runner instance
          # hits the container-name conflict — clear any survivor first.
          docker rm -f zylaxion-rootfs >/dev/null 2>&1 || true
          docker run --name zylaxion-rootfs -d ubuntu:24.04 sleep infinity
          docker exec zylaxion-rootfs timeout 240 apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=45 update -qq
          # python3: the engine. sudo + passwd: the real-user lane.
          # kmod: the insmod chain. libasound2: the payload's ALSA
          # runtime. iproute2: the init's loopback bring-up.
          # linux-tools-generic (night-dragon-lts): the versioned
          # bpftool binary. The guest boots ARCHIVE kernels no noble
          # tools package names, and noble's /usr/sbin/bpftool is a
          # uname-keyed wrapper that exits 2 for any other kernel —
          # the init promotes the versioned binary onto PATH instead
          # (see supermassive-init.sh), so the churn catch can read
          # the tap's run counters.
          # night-badas-4 round 3+4 (empirical): noble renamed the ALSA
          # runtime in the time_t transition and kept 'libasound2' as a
          # purely-virtual name (Provided by 'libasound2t64') — an
          # apt-cache probe exits 0 on a purely-virtual name while the
          # install still dies with "no installation candidate". The
          # honest probe is the resolver itself: an `apt-get install
          # -s` simulation of each name, and the first that resolves
          # wins. The payload's soname need is libasound.so.2 either
          # way, the t64 rebuild ships exactly that.
          ALSA_RUNTIME=libasound2
          if ! docker exec zylaxion-rootfs sh -c \
            "timeout 180 apt-get install -s -qq libasound2 > /dev/null 2>&1"; then
            ALSA_RUNTIME=libasound2t64
          fi
          echo "ALSA runtime package: $ALSA_RUNTIME"
          docker exec zylaxion-rootfs timeout 600 apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=45 install -y -qq \
            --no-install-recommends python3 sudo kmod passwd "$ALSA_RUNTIME" iproute2 \
            linux-tools-generic
          docker exec zylaxion-rootfs python3 -c 'import sys; assert sys.version_info >= (3, 10)'
          docker export zylaxion-rootfs -o rootfs.tar
          mkdir -p rootfs
          tar -xf rootfs.tar -C rootfs
          mkdir -p rootfs/opt/zylaxion/modules
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C rootfs/opt/zylaxion
          cp "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/pro-linux-amd64-v3-gnu/zylaxion" \
            rootfs/opt/zylaxion/zylaxion
          test -x rootfs/opt/zylaxion/zylaxion
          # The below-floor leg stages no modules (the empty mods dir
          # is the honest shape there) — the glob guard keeps the cp
          # from failing on nothing to copy.
          if compgen -G "/tmp/kfloor/mods/*.ko*" > /dev/null; then
            cp /tmp/kfloor/mods/*.ko* rootfs/opt/zylaxion/modules/
          fi
          cp "$GITHUB_WORKSPACE/scripts/ci/supermassive-init.sh" rootfs/init
          chmod +x rootfs/init
          # The guest's Unix shape: the whole tree belongs to root.
          # The extraction above runs as the runner user, and a
          # non-root tar defaults to --no-same-owner — the
          # docker-exported tree (every apt-installed file, sudo's
          # config included) lands owned by the runner's uid. The
          # guest's sudo refuses to run when /etc/sudo.conf and
          # /etc/sudoers are not root-owned, which beheaded the whole
          # real-user lane at the sudo door before zylaxion was ever
          # reached (night-badas-4 round 5, run 38375322712).
          sudo chown -hR root:root rootfs
          # PID 1 needs a console to exec onto before devtmpfs lands:
          # remove whatever the tar degraded, mknod the real char
          # device fresh (the zelynic assembly lesson).
          sudo rm -f rootfs/dev/console
          sudo mknod -m 600 rootfs/dev/console c 5 1
          ( cd rootfs && sudo find . -print0 | sudo cpio --null -o -H newc ) | gzip -1 > initrd.gz
          echo "initramfs: $(du -h initrd.gz | cut -f1)"

      # Boot the micro-VM: direct kernel boot, KVM host-passthrough
      # CPU, no disk, no egress (the battery is offline by design —
      # zylaxion needs no network and a deterministic guest beats a
      # wired one), serial console to stdout, panic=-1 + -no-reboot so
      # a kernel panic ends qemu instead of hanging the job, the
      # outer timeout so a wedged guest can never burn the job budget,
      # and the isa-debug-exit device — the guest ends the VM
      # deterministically by writing one byte to port 0xf4.
      - name: Boot the micro-VM and run the whole-chaos battery
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          CORES=$(nproc)
          TOTAL_MB=$(free -m | awk '/^Mem:/{print $2}')
          if [ "${{ matrix.leg.pocket }}" = "floor" ] || [ "${{ matrix.leg.pocket }}" = "below-floor" ]; then
            # The LOW envelope (the low leg's own math, the zejtron
            # low-shape): one quarter of the cores floored at 1, one
            # eighth of the RAM floored at 1024 MB — the floor leg
            # proves the tool on a SMALL machine wearing the OLD
            # kernel (the low-specs contract on both axes). The
            # below-floor leg rides the same low shape: the refusal
            # witness is a low-specs audit of the dying-kernel world.
            SMP=$(( CORES / 4 )); [ "$SMP" -lt 1 ] && SMP=1
            MEM=$(( TOTAL_MB / 8 )); [ "$MEM" -lt 1024 ] && MEM=1024
          else
            # The BEST envelope (the zelynic dynamic doctrine — never
            # pin one era's hardware): every core, three quarters of
            # the RAM.
            SMP=$CORES
            MEM=$(( TOTAL_MB * 3 / 4 )); [ "$MEM" -lt 2048 ] && MEM=2048
          fi
          echo "envelope: $SMP vCPU / $MEM MB (of $CORES cores / $TOTAL_MB MB on the runner)"
          set +e
          # The guest budget, sized to the measured record (the
          # zelynic fail-fast doctrine): the whole in-VM battery —
          # boot, the init probes, the full engine with the storm —
          # runs in a few minutes on every leg and kernel measured so
          # far; 900 s is ~5-10x that record, generous over a first
          # boot, and a wedged guest can never burn the job budget
          # past it.
          timeout 900 qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host \
            -m "$MEM" -smp "$SMP" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -kernel vmlinuz \
            -initrd initrd.gz \
            -append "console=ttyS0 panic=-1 massleg=${{ matrix.leg.pocket }}" \
            -nographic -no-reboot 2>&1 | tee vm.log
          QEMU_RC=${PIPESTATUS[0]}
          set -e
          # rc 0 = a natural poweroff; rc 1 = the guest's deliberate
          # isa-debug-exit (the verdict itself rides the MASS-*
          # sentinel lines, so the Verdict step stays the authority).
          if test "$QEMU_RC" -ne 0 && test "$QEMU_RC" -ne 1; then
            echo "FAIL: qemu exited $QEMU_RC — log tail:"
            tail -40 vm.log
            exit 1
          fi
          exit 0

      # The verdict lives in the log (the VM cannot relay exit codes
      # through qemu; the MASS-* sentinel lines are the contract —
      # scripts/ci/supermassive-init.sh owns them).
      - name: Verdict
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          echo "── supermassive verdicts (${{ matrix.leg.pocket }} pocket) ──"
          grep -E '^MASS-(RESULT|VERDICT)' vm.log || true
          grep -q '^MASS-VERDICT: PASS' vm.log
          echo "OK: the zero-to-hero chain proven on ${{ matrix.leg.title }}"

      - name: Battery inventory (the step summary)
        if: always()
        run: |
          cd /tmp/kfloor
          {
            echo "## supermassive E2E — ${{ matrix.leg.title }}"
            echo
            echo '```'
            grep -E '^MASS-(RESULT|VERDICT)' vm.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
