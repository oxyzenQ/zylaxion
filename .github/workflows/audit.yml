# =============================================================================
# DRAGON GUARD - SECURITY AUDIT — the supply-chain CVE watch
# =============================================================================
#
# night-badas-5 (the zelynic audit.yml lineage): the cargo-audit scan
# moves out of ci.yml into its own scanner workflow. The scanner rule
# (the zelynic NIGHT-improve-11 law): a scanner workflow carries the
# surface it scans. Since night-dragon-maintenance-2 the surface is
# the WHOLE tree on every push — the owner's unfiltered-CI
# simplification (no path filter, no branch filter; a manifest-adjacent
# change the globs never named — a vendored lock, a workspace split —
# could ride straight past a filtered scanner). The weekly
# between-pushes clock is retired (night-fly-1, the estate's
# no-schedule law: every test lane wakes on commit alone) — cargo-audit
# fetches the advisory database fresh on every run, so the verdict is
# always as current as the last commit; maintenance.yml keeps the
# estate's only remaining clock.
#
# This is the canonical source for vulnerability scanning — the local
# gatekeeper (build.sh check-all) runs cargo audit as its [4/4] step
# too, but as an advisory pass (a soft skip when the binary is absent);
# this lane owns the hard verdict (cargo audit --deny warnings: any
# advisory blocks).
#
# night-deny-law-1: the workflow now carries the second scanner, the
# cargo-deny graph gate (deny.toml at the root). The poisoned-patch
# class the CVE watch cannot catch on day zero — a hostile release
# with no advisory entry yet — is answered on the graph-shape axis:
# crates.io-only sources, yanked releases denied, wildcard
# requirements refused. The local gatekeeper runs the same verdict as
# its [5/5] advisory step.
#
# No schedule (night-fly-1, the estate's no-schedule law): the test
# lanes wake on commits alone — no Sunday clock rides this lane.
# =============================================================================
---
name: Dragon Guard - Security Audit

"on":
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  # night-strict-warnings-1: carried uniformly; this lane compiles
  # nothing from the tree (the law lives in ci.yml's env block).
  ZYLAXION_STRICT_WARNINGS: "1"

jobs:
  audit:
    name: Supply-chain CVE scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          # night-dragon-maintenance-6: the checkout token never
          # outlives this step — no later step can read it back.
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

  # night-deny-law-1: the graph gate. Same scanner rule as the CVE
  # job: this workflow carries the surface it scans (deny.toml rides
  # the checkout), and the verdict is hard — any denied source, yanked
  # lockfile entry, or wildcard requirement blocks the push.
  deny:
    name: Supply-chain graph gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny
        # --locked is a global flag on cargo-deny: the gate reads the
        # committed lockfile and never resolves a fresh one mid-verdict.
        run: cargo deny --locked check advisories bans sources
