# night-improve-12c (the zelynic release masterclass lineage): the
# Dragon Guard name replaces the plain "Release", the matrix becomes
# the x86-64-v3/v4 arch-baseline pair, and the pipeline gains the
# version contract, the embedded-label verification, the flat tarball
# invariant, and the GPG detached-signature lane.
name: Dragon Guard - Release

on:
  push:
    tags:
      - "v*"
  # The recovery lane: a dispatch on the tag ref re-runs the whole
  # pipeline — validate, both builds, publish — WITHOUT re-pushing
  # anything, so a mid-flight red (a transient API 5xx, a runner
  # hiccup) heals with one click instead of delete + re-push the tag
  # (which is the moved-tag class the concurrency group cancels).
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  # Single source of truth for the Rust toolchain version. Keep in
  # sync with rust-toolchain.toml + Cargo.toml rust-version.
  RUST_VERSION: "1.98.1"

# Re-pushing a MOVED tag supersedes the in-flight run — the superseded
# build compiles a commit the tag no longer points at, so its artifacts
# are wrong by definition and canceling them is the only correct
# outcome. Different tags land in different groups and never interact.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# THE PLATFORM MATRIX
# ============================================================================
# Shipping contract: glibc ONLY (x86_64-unknown-linux-gnu), amd64 ONLY,
# the x86-64-v3 and v4 optimization baselines ONLY. Two legs, both live
# below. There is no musl lane and no other libc: every package
# zylaxion ships is a dynamic glibc build, by decision.
# ============================================================================

jobs:
  # ===========================================================================
  # Validate Release Tag (fail fast, before any build cost)
  # ===========================================================================
  # Release channel contract (night-dragon-maintenance-3): the tag is
  # the whole truth. A plain vX.Y.Z is a stable release; vX.Y.Z-<any
  # suffix> is a pre-release — the hyphen after the patch segment is
  # the ONLY signal, so no channel list exists to maintain (a new
  # suffix shape needs zero workflow edits). Any other shape fails
  # validation here, so no binary is built and no GitHub release is
  # ever created for a malformed tag.
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check tag shape and channel
        id: check
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REF"
          # The strict gate (the zejtron night-total-lts-2 law): the
          # case below only CLASSIFIES the pre-release split — it was
          # never a validator. A glob * crosses dots, semicolons and
          # quotes, so a crafted refname must never ride its * into
          # the build jobs' string interpolations. Only a strict
          # vX.Y.Z(-suffix) refname reaches the release lane.
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::tag ${TAG} is not a strict v-prefixed semver (vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # The hyphen law: FIRST match wins in a bash case, and a
          # glob * crosses '-', so the pre-release branch MUST come
          # first — the reversed order classified every vX.Y.Z-suffix
          # tag stable (the zejtron night-dragon-1S incident:
          # v80.0.0-nightly.1 shipped a stable-flagged release
          # through exactly that hole).
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*-*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "pre-release tag (hyphen after the patch): ${TAG}"
              ;;
            v[0-9]*.[0-9]*.[0-9]*)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "stable release tag: ${TAG}"
              ;;
            *)
              echo "::error::tag ${TAG} is not a v-prefixed semver (vX.Y.Z or vX.Y.Z-suffix)"
              exit 1
              ;;
          esac

  # ===========================================================================
  # Build (the arch-baseline matrix)
  # ===========================================================================
  build:
    name: Build ${{ matrix.platform }}
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The -Wl,-z,now hardening token (full RELRO): the GNU dynamic
          # loader resolves the GOT eagerly and maps it read-only before
          # main — the standard glibc-binary hardening posture, a
          # one-time startup cost (a daemon starts once, runs for days)
          # for a real attack-time win (GOT overwrite dies at the first
          # write). rustc's default is partial RELRO; this upgrades the
          # shipping binaries. The parity gate and the verify step below
          # hold the token on both the matrix and the local alias sides.
          - platform: linux-amd64-v3-gnu
            target: x86_64-unknown-linux-gnu
            rustflags: "-D warnings -C target-cpu=x86-64-v3 -C link-arg=-Wl,-z,now"
          - platform: linux-amd64-v4-gnu
            target: x86_64-unknown-linux-gnu
            rustflags: "-D warnings -C target-cpu=x86-64-v4 -C link-arg=-Wl,-z,now"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          # The release build needs exactly one commit — the one the tag
          # points at. Nothing in this job reads git metadata (the
          # shipped version comes from Cargo.toml via
          # env!("CARGO_PKG_VERSION")), so depth 1 is the high-speed
          # checkout.
          fetch-depth: 1
          # night-dragon-maintenance-6: the checkout token never
          # outlives this step — no later step can read it back.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, the zelynic estate SHA
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          # The supermassive apt idiom (retries + connect timeout).
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=45 update -qq
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=45 install -y -qq \
            libasound2-dev pkg-config

      # night-badas-1: the ebpf feature went default in night-improve-23,
      # so every release build source-builds the kernel object through
      # build.rs and hard-requires the dated nightly pin + bpf-linker —
      # the release lane never had them, so the first tag push after
      # that turn would have died in the build script's preflight. The
      # last green release (v11.0.0) predates the turn by 70 commits;
      # this closes the latent gap before the next tag. The same
      # cache + bootstrap pair as the ci.yml check lane, and the
      # daemon-era libinput-dev / libudev-dev packages go (only the
      # cpal ALSA headers remain a build prerequisite).
      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Cache keyed per platform id. The v3/v4 builds of one triple
      # share the triple but differ in RUSTFLAGS — cargo's fingerprints
      # include RUSTFLAGS, so a shared key is refingered (never
      # mis-served); the platform id keeps the two legs' saves disjoint
      # (the zelynic cache-collision lesson).
      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.platform }}-

      # Tripwire: the matrix rustflags ARE the build contract — a
      # platform whose flag set drifted from its documented baseline
      # fails HERE, before any compile time is spent. The same constants
      # live in .cargo/config.toml's pro-linux-amd64-* aliases; the
      # cross-file equality is held by scripts/gates/check-release-parity.sh.
      - name: Verify arch-baseline inputs
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux-amd64-v3-gnu) expected="-D warnings -C target-cpu=x86-64-v3 -C link-arg=-Wl,-z,now" ;;
            linux-amd64-v4-gnu) expected="-D warnings -C target-cpu=x86-64-v4 -C link-arg=-Wl,-z,now" ;;
            *) echo "::error::Unknown platform id ${{ matrix.platform }}"; exit 1 ;;
          esac
          if [ "${{ matrix.rustflags }}" != "${expected}" ]; then
            echo "::error::${{ matrix.platform }} must use RUSTFLAGS='${expected}', got '${{ matrix.rustflags }}'"
            exit 1
          fi
          echo "arch-baseline inputs verified: ${{ matrix.platform }}"

      # The tag and Cargo.toml must name the SAME version before any
      # compile time is spent: a tag pushed while Cargo.toml still
      # carries the previous version would ship a tarball named vX.Y.Z
      # whose binary answers -V with the older number.
      - name: Verify Cargo.toml version matches the tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VER="$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)".*/\1/')"
          if [ -z "${CARGO_VER}" ]; then
            echo "::error::could not parse version from Cargo.toml"
            exit 1
          fi
          if [ "${CARGO_VER}" != "${VERSION}" ]; then
            echo "::error::Cargo.toml version '${CARGO_VER}' != tag '${VERSION}'"
            echo "Bump the package version before tagging: ./scripts/dev/version-to.sh ${VERSION}"
            exit 1
          fi
          echo "version contract holds: Cargo.toml == tag == ${VERSION}"

      # --locked on every release build: a release must reproduce from
      # the committed lockfile — never a fresh resolution at tag time.
      # ZYLAXION_BUILD stamps the platform id into the binary's Build:
      # line (see the verify step) — one field, one truth; the embedded
      # label and the tarball name agree by construction.
      - name: Build release binary
        env:
          ZYLAXION_BUILD: ${{ matrix.platform }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify binary
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/zylaxion"
          PLATFORM="${{ matrix.platform }}"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "=== ${PLATFORM} (Build: ${PLATFORM}) ==="
          case "${PLATFORM}" in
            *-v4-*)
              # AVX-512 baseline: the runner may lack AVX-512, so the
              # artifact is verified WITHOUT executing it (executing
              # it could SIGILL): the embedded ZYLAXION_BUILD label
              # plus the version-report literals prove the right
              # variant was compiled and linked. The literals are
              # grepped as BYTES straight against the artifact
              # (grep -aFq, no encoding layer — strings(1) splits
              # multi-byte sequences and would silently miss).
              grep -aFq "${PLATFORM}" "${BIN}" \
                || { echo "::error::Expected embedded build label ${PLATFORM}"; exit 1; }
              grep -aFq "License: GPL-3.0-only" "${BIN}" \
                || { echo "::error::Expected embedded license literal"; exit 1; }
              grep -aFq "${VERSION}" "${BIN}" \
                || { echo "::error::Binary does not embed tag version '${VERSION}' (Cargo.toml/tag drift)"; exit 1; }
              echo "embedded build metadata verified (execution skipped: AVX-512 baseline)"
              ;;
            *-v3-*)
              # AVX2/BMI2/FMA baseline: every x86_64 runner since
              # Haswell executes it — run the artifact itself, plus
              # the Build: label and version checks.
              "${BIN}" -V
              "${BIN}" -V | grep -F "Build: ${PLATFORM}" \
                || { echo "::error::Expected 'Build: ${PLATFORM}' in -V"; exit 1; }
              "${BIN}" -V | grep -F "zylaxion: v${VERSION}" \
                || { echo "::error::Expected 'zylaxion: v${VERSION}' in -V (Cargo.toml/tag drift)"; exit 1; }
              "${BIN}" -V | grep -F "Build-time: " \
                || { echo "::error::Expected 'Build-time:' line in -V"; exit 1; }
              ;;
          esac
          echo "=== ldd ==="
          ldd "${BIN}" || true

      - name: Prepare release artifact
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}

          # Flat archive layout (the zelynic release invariant): the
          # tarball carries ONLY zylaxion + LICENSE + README.md, at
          # archive root. The tripwire below records the three entries.
          PKG="zylaxion-v${VERSION}-${{ matrix.platform }}"
          STAGE="dist/stage"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/zylaxion" "${STAGE}/"
          chmod +x "${STAGE}/zylaxion"
          cp README.md LICENSE "${STAGE}/"
          tar -czf "dist/${PKG}.tar.gz" -C "${STAGE}" zylaxion LICENSE README.md
          ACTUAL=$(tar -tzf "dist/${PKG}.tar.gz" | sort | tr '\n' ' ')
          if [ "${ACTUAL}" != "LICENSE README.md zylaxion " ]; then
            echo "::error::tarball invariant violated for ${PKG}: ${ACTUAL}"
            exit 1
          fi
          rm -rf "${STAGE}"
          cd dist
          # Checksums: SHA-512 (classical) + BLAKE3-256 + SHAKE256
          # (quantum-resistant). The blake3 lane (night-dinner-2):
          # the official b3sum CLI from crates.io, version-pinned so
          # the release digest is reproducible, --locked so its
          # dependency graph can't drift under us. cargo install
          # builds for the runner host (the matrix --target only
          # affects the zylaxion builds, never this helper).
          cargo install --locked b3sum@1.8.7 --quiet
          command -v b3sum >/dev/null \
            || { echo "::error::b3sum missing from PATH after install"; exit 1; }
          sha512sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha512sum"
          b3sum "${PKG}.tar.gz" > "${PKG}.tar.gz.b3sum"
          python3 -c "
          import hashlib
          data = open('${PKG}.tar.gz', 'rb').read()
          h = hashlib.shake_256(data).hexdigest(64)
          print(f'{h}  ${PKG}.tar.gz')
          " > "${PKG}.tar.gz.shake256"

          echo ""
          echo "=== Release artifacts ==="
          ls -lh

      # =========================================================================
      # GPG detached ASCII-armored signatures for every release tarball.
      #
      # Placement: signing runs HERE, in the build job, which holds no
      # `contents: write` token (top-level default is read). The private
      # key therefore never enters the environment of the job that
      # publishes the GitHub release — least privilege for the most
      # sensitive secret in the pipeline.
      #
      # Contract: when the GPG_PRIVATE_KEY secret is not configured, the
      # Import step exits 0 without exporting a key id, the Sign step's
      # if-gate never fires, and the release ships checksums-only — no
      # release is ever blocked on signing configuration.
      #
      # Passphrase confinement: the passphrase NEVER enters GITHUB_ENV.
      # The Import step keeps it in step-scoped env + stdin
      # (--passphrase-fd 0, never a command line), the Sign step
      # re-reads it from secrets directly in its own step env, and the
      # only value that crosses steps is GPG_KEY_ID — a public key id,
      # not a secret.
      # =========================================================================
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "GPG_PRIVATE_KEY secret not configured — skipping GPG signing"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg-sign"
          # SC2174 split: with -p, mkdir's -m only applies to the deepest
          # directory — create first, then pin the mode, so every level
          # that materializes lands at 700 regardless.
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          if [ -n "${GPG_PASSPHRASE}" ]; then
            echo "${GPG_PASSPHRASE}" | gpg --import --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 \
              <(echo "${GPG_PRIVATE_KEY}")
          else
            echo "${GPG_PRIVATE_KEY}" | gpg --import --batch --yes \
              --pinentry-mode loopback
          fi
          gpg --list-secret-keys --with-colons || true
          # Signing-capable key first (field $12 carries the capability
          # flags, 'S' = signing), then any imported secret (sub)key —
          # some gpg versions populate the flags differently.
          KEY_ID="$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^(ssb|sec):/ && $12 ~ /S/ {print $5; exit}')"
          if [ -z "${KEY_ID}" ]; then
            KEY_ID="$(gpg --list-secret-keys --with-colons \
              | awk -F: '/^(ssb|sec):/ {print $5; exit}')"
          fi
          if [ -z "${KEY_ID}" ]; then
            echo "::error::Failed to import GPG secret key (no signing-capable key found)"
            gpg --list-secret-keys 2>&1 || true
            exit 1
          fi
          echo "GPG_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"
          echo "Imported GPG signing key: ${KEY_ID}"

      - name: Sign artifacts (detached GPG signatures)
        if: env.GPG_KEY_ID != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg-sign"
          cd dist
          # Idempotence: a recovered re-run never re-signs (stable
          # artifact bytes).
          find . -maxdepth 1 -name '*.tar.gz' -print0 \
            | while IFS= read -r -d '' artifact; do
                if [ -f "${artifact}.asc" ]; then
                  echo "  (existing sig) ${artifact}.asc"
                  continue
                fi
                echo "  signing ${artifact}"
                if [ -n "${GPG_PASSPHRASE}" ]; then
                  echo "${GPG_PASSPHRASE}" | gpg --batch --yes --detach-sign --armor \
                    --local-user "${GPG_KEY_ID}" --passphrase-fd 0 --pinentry-mode loopback \
                    --output "${artifact}.asc" "${artifact}"
                else
                  gpg --batch --yes --detach-sign --armor \
                    --local-user "${GPG_KEY_ID}" \
                    --output "${artifact}.asc" "${artifact}"
                fi
              done
          echo "--- Verify loop ---"
          find . -maxdepth 1 -name '*.tar.gz' -print0 \
            | while IFS= read -r -d '' artifact; do
                echo "  verifying ${artifact}.asc"
                gpg --batch --verify "${artifact}.asc" "${artifact}" 2>&1 \
                  || { echo "::error::gpg --verify failed for ${artifact}"; exit 1; }
              done
          echo "--- Signed artifacts ---"
          find . -name '*.asc' -print | sort
          echo "--- All signatures verified ---"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7, the zelynic estate SHA pin
        with:
          # One artifact per platform; the release job merges them
          # (merge-multiple) so signing stays in the build-class jobs
          # (least privilege) while the matrix scales.
          name: release-artifacts-${{ matrix.platform }}
          path: dist/*

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [validate, build]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Checkout runs BEFORE the artifact download: actions/checkout's
      # default `clean: true` deletes workspace contents — under the
      # wrong order it wipes the freshly downloaded dist/ and the
      # publish step logs "Pattern 'dist/*' does not match any files"
      # as a MERE WARNING, shipping a green, asset-less release (the
      # zelynic NIGHT-dinner-3 live incident). Checkout first, download
      # second, tripwire third.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          fetch-depth: 1
          # night-dragon-maintenance-6: the checkout token never
          # outlives this step — no later step can read it back.
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8, the zelynic estate SHA pin
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: dist

      # The workflow, not a third-party action, decides what "assets
      # present" means. The matrix is two legs (v3/v4 gnu); each
      # Prepare step emits one tarball plus three checksum files, and
      # the signing tripwire makes GPG all-or-nothing — so the legal
      # shapes here are exactly: 2 tarballs + 6 checksums + (0 or 2)
      # signatures.
      - name: Assert release asset inventory
        run: |
          set -euo pipefail
          TARBALLS=$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
          if [ "${TARBALLS}" -ne 2 ]; then
            echo "::error::Expected 2 release tarballs in dist/ (the build matrix legs), found ${TARBALLS}"
            find dist -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          BROKEN=0
          for f in dist/*.tar.gz; do
            for suffix in sha512sum b3sum shake256; do
              if [ ! -f "${f}.${suffix}" ]; then
                echo "::error::Missing checksum sibling ${f}.${suffix}"
                BROKEN=1
              fi
            done
          done
          SIGS=$(find dist -maxdepth 1 -type f -name '*.tar.gz.asc' | wc -l)
          if [ "${SIGS}" -ne 0 ] && [ "${SIGS}" -ne "${TARBALLS}" ]; then
            echo "::error::Partial GPG coverage: ${SIGS} of ${TARBALLS} tarballs signed (all-or-nothing)"
            BROKEN=1
          fi
          if [ "${BROKEN}" -ne 0 ]; then
            exit 1
          fi
          echo "dist/ verified: ${TARBALLS} tarballs, ${SIGS} GPG signatures, $(( TARBALLS * 3 )) checksum files"

      # The release body has exactly one implementation in the tree:
      # scripts/release/generate-release-notes.sh (night-improve-30,
      # the zelynic cosmostrix release-page shape ported verbatim —
      # the owner's format-consistency contract). The former inline
      # renderer died twice for the same root cause: it read the
      # changelog boundary from the LOCAL clone (a shallow checkout
      # carries no previous tag, git log answered empty, and the
      # v80.0.0-beta.1 page shipped with its Changes section empty)
      # and it invented a bespoke format the reference releases page
      # never used. This step renders from the compare API JSON — no
      # local refs, no clone dependency — and the generator's
      # self-test battery runs first so a drifted classifier fails
      # the pipeline BEFORE a broken body publishes.
      - name: Generate release body
        id: body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.validate.outputs.tag }}"
          IS_PRERELEASE="${{ needs.validate.outputs.prerelease }}"

          # Bounded retry for the API reads below (the zelynic
          # NIGHT-improve-32 shape): a just-pushed tag occasionally
          # answers its first requests with a transient 5xx — the
          # same-repository API is eventually consistent on fresh
          # refs. Three attempts, five seconds apart, then the real
          # error surfaces unchanged.
          gh_api() {
            local attempt out
            for attempt in 1 2 3; do
              if out=$(gh api "$@"); then
                printf '%s\n' "$out"
                return 0
              fi
              echo "gh api attempt ${attempt} failed — retrying in 5s" >&2
              sleep 5
            done
            return 1
          }

          # All tag names via the API — no clone, no local refs.
          TAGS=$(gh_api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name')

          # Previous changelog boundary (the hyphen law — the same
          # rule the validate step holds):
          # Pre-release: prev = any previous tag by semver (users
          #   testing pre-release builds want the changes since the
          #   last build of any kind).
          # Stable: prev = nearest previous STABLE tag (skip every
          #   pre-release — the hyphen is the only signal) — the
          #   stable changelog spans from the last stable release.
          # awk (never grep) so a zero-match filter is not a failed
          # pipeline under pipefail — "no previous tag" is a legal
          # state, not an error.
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PREV_TAG=$(printf '%s\n' "${TAGS}" \
              | awk -v cur="${TAG}" '$0 != cur' \
              | sort -V | tail -1)
          else
            PREV_TAG=$(printf '%s\n' "${TAGS}" \
              | awk -v cur="${TAG}" \
                '$0 != cur && $0 !~ /^v[0-9]+\.[0-9]+\.[0-9]+-/' \
              | sort -V | tail -1)
          fi

          # The last STABLE tag (the same filter the stable PREV_TAG
          # branch uses above) — pre-release bodies render the dual
          # range line with it: "N commits since previous build ·
          # M commits since last stable".
          LAST_STABLE=$(printf '%s\n' "${TAGS}" \
            | awk -v cur="${TAG}" \
              '$0 != cur && $0 !~ /^v[0-9]+\.[0-9]+\.[0-9]+-/' \
            | sort -V | tail -1)

          # Commits between the boundary and the tag, straight from
          # the compare API. Merge commits (more than one parent)
          # are skipped inside the generator, and the API's
          # 250-commit listing cap carries an honest truncation note.
          # Zero previous tags = initial release (the generator
          # renders the marker itself).
          COMPARE_JSON=""
          if [ -n "${PREV_TAG}" ]; then
            gh_api "repos/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}" > compare.json
            COMPARE_JSON=compare.json
          fi

          # The distance from the last stable tag (one more
          # retry-wrapped compare call; total_commits semantics —
          # merge commits included). Only pre-release bodies need it,
          # and only when the boundaries actually differ.
          SINCE_STABLE=""
          if [ -n "${COMPARE_JSON}" ] && [ -n "${LAST_STABLE}" ] \
            && [ "${LAST_STABLE}" != "${PREV_TAG}" ]; then
            SINCE_STABLE=$(gh_api \
              "repos/${GITHUB_REPOSITORY}/compare/${LAST_STABLE}...${TAG}" \
              --jq '.total_commits')
          fi

          scripts/release/generate-release-notes.sh --self-test

          scripts/release/generate-release-notes.sh \
            --tag "${TAG}" \
            --prerelease "${IS_PRERELEASE}" \
            --compare-json "${COMPARE_JSON}" \
            --prev-tag "${PREV_TAG}" \
            --last-stable "${LAST_STABLE}" \
            --since-stable "${SINCE_STABLE}" \
            > release-body.md

          # Release title: the bare tag name (the cosmostrix
          # convention) — GitHub's own Pre-release badge marks the
          # channel in the releases list, and the body's WARNING
          # callout carries the expectation-setting text.
          echo "title=${TAG}" >> "$GITHUB_OUTPUT"

          echo "=== Release body ==="
          cat release-body.md

          # Platform-cap tripwire: GitHub silently truncates a stored
          # release body over ~125,000 characters. The generator owns
          # the policy budget (MAX_BODY_CHARS) and refuses over-budget
          # bodies itself; this is the independent guard on the exact
          # file the publish step below uploads — drift, a hand edit,
          # or a future budget bump past the platform cap all die
          # HERE, red and named, instead of shipping a silently
          # truncated page.
          BODY_BYTES=$(wc -c < release-body.md | tr -d ' ')
          if [ "${BODY_BYTES}" -gt 124000 ]; then
            echo "::error::Release body is ${BODY_BYTES} bytes — over the 124,000-byte platform cap."
            echo "Refusing to publish a body GitHub would silently truncate."
            exit 1
          fi

      # The upload list is what dist/ actually holds, not a wish list.
      # The static glob block used to promise dist/*.tar.gz.asc even
      # when signing shipped none (GPG secrets optional by contract),
      # and fail_on_unmatched_files turned that promise into a hard
      # release failure. Enumerating the tripwire-certified inventory
      # keeps fail_on_unmatched_files honest: it now guards against a
      # file vanishing between enumeration and upload instead of
      # against an empty optional pattern.
      - name: Enumerate release assets
        id: assets
        run: |
          set -euo pipefail
          LIST="$(find dist -maxdepth 1 -type f \( \
            -name '*.tar.gz' -o \
            -name '*.tar.gz.sha512sum' -o \
            -name '*.tar.gz.b3sum' -o \
            -name '*.tar.gz.shake256' -o \
            -name '*.tar.gz.asc' \) | sort)"
          if [ -z "${LIST}" ]; then
            echo "::error::No release assets found in dist/"
            exit 1
          fi
          echo "${LIST}"
          {
            echo "list<<EOF"
            echo "${LIST}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3, night-improve-8 SHA pin
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          # The bare tag name the body step emits (the cosmostrix
          # convention, night-improve-30) — one source of truth for
          # the title, the body's callout carries the channel text.
          name: ${{ steps.body.outputs.title }}
          body_path: release-body.md
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.list }}
