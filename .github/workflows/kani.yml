# OS: Linux only — zylaxion is a Linux keyboard-sound tool; no other OS is supported.
#
# Dragon Guard - Kani (night-depth-hardening-2/3): the proven datapath lane.
# The bounded-model-checking verifier compiles the pure law harnesses in
# src/engine/kani_proofs.rs and src/engine/kani_laws.rs — twenty of
# them after night-depth-hardening-4's tail split — and proves each
# invariant over the WHOLE reachable input
# space, not a sampled slice of it. Unit tests sample; this lane
# quantifies. night-depth-hardening-4's second measurement round
# landed the reshaping the on-demand era was waiting for: the three
# string-walking bodies the deep legs ride (the errno classifiers'
# fallthrough, the verifier tail's keep and join stages, the cmdline
# matcher) are flattened to manual scans the verifier's pointer model
# carries without the iterator machinery's memory bombs, and every
# deep leg now measures seconds locally (2/3/2 s classifiers,
# 12/8 s tail, 9 s cmdline). So ALL twenty harnesses ride push:
# seventeen through the fast families below (eight legs, every leg
# inside the twelve-minute cap) and three through the deep job at
# the bottom of this file — the on-demand gate is retired, no job
# skips, and night-fly-1's fifteen-minute wall still caps every
# leg. The deep job's fifteen-minute cap is now headroom, not a
# cliff: a leg that outmeasures it still goes red as the honest
# signal that a reshape regressed.
#
# night-depth-hardening-3 makes the lane a push net, not an absent one: the
# push and pull_request triggers ride UNFILTERED (the owner's unfiltered-CI
# simplification — no path filter, no branch filter, the same blind posture
# ci.yml and miri.yml carry — the surface globs' sync tax cost more than the
# runner minutes they saved), and workflow_dispatch is the on-demand
# full run (night-fly-1: no schedule rides the test lanes). The build
# prerequisites ride the same pair every other root-crate lane carries
# (ci.yml, miri.yml, maintenance.yml): the apt install feeds alsa-sys's
# pkg-config probe, and the bootstrap provides the dated nightly pin and
# bpf-linker that the default ebpf feature's preflight hard-requires — a
# Kani build compiles the same build.rs as every other lane, so a missing
# prerequisite is a red verifier run with no proof in it (the same
# 55-second red shape miri.yml documents from the pre-bootstrap era).
#
# The loom verdict (the other half of the proven-datapath pitch, answered
# honestly): NO loom. The concurrency surface is std primitives plus the
# external crates' own protocols — no hand-rolled lock-free algorithm to
# prove — and the ring lanes already carry deterministic interleaving pins
# (night-hardening-2, night-frontier-Z1). A loom dependency here would
# model-check the vendors' internals, not this tree's code: theater, not
# proof. The Kani half is the honest half and it is wired below.

name: Dragon Guard - Kani

on:
  push:
  pull_request:
  # Manual trigger from the Actions tab — the on-demand full run
  # (night-fly-1: no schedule rides the test lanes). Every job runs
  # on push and PR; the deep legs are no longer dispatch-only.
  workflow_dispatch:

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# Rapid pushes to the same ref cancel the superseded run instead of
# queueing a duplicate verifier build (the miri.yml shape).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  kani:
    name: prove ${{ matrix.family.name }}
    runs-on: ubuntu-24.04
    # night-frontier-Z7 verify: the micro-matrix split. The lane ran
    # all harnesses in ONE job — the only job in the estate
    # that ever approached or passed the fifteen-minute wall (the
    # owner's hard line: nothing waits that long), and the single-job
    # shape turned the install stall into a total lane outage. The
    # push gate keeps what measures fast: four families and
    # four singles cover seventeen harnesses, each leg its own runner,
    # its own twelve-minute cap, and its own named verdict (fail-fast
    # false — one red leg never hides the others). Every leg measured
    # 1.6 to 4.4 minutes on the first split run, and the
    # errno-classifiers family joined at measured second-scale weight
    # (night-depth-hardening-4). The three deep harnesses ride the
    # deep job below, on every push now that their bodies are
    # flattened.
    strategy:
      fail-fast: false
      matrix:
        family:
          - name: render-laws (the entry 44 trio)
            args: >-
              --harness engine::kani_proofs::proofs::volume_bits_clamps_every_volume
              --harness engine::kani_proofs::proofs::gain_from_percent_is_finite_and_monotone
              --harness engine::kani_proofs::proofs::u32_to_signed_f32_stays_in_unit_range
          - name: decision-ladder-and-pid
            args: >-
              --harness engine::kani_proofs::proofs::ladder_next_is_total_and_shape_true
              --harness engine::kani_proofs::proofs::ladder_has_no_orphan_arm
              --harness engine::kani_proofs::proofs::ladder_collapses_above_stage_two
              --harness engine::kani_proofs::proofs::pid_identity_gate_refuses_unreadable_shapes
          - name: wire-and-errno-text
            args: >-
              --harness engine::kani_laws::errno_proofs::attach_error_codes_round_trip_inside_the_pinned_band
              --harness engine::kani_laws::errno_proofs::attach_error_codes_refuse_outside_the_band
              --harness engine::kani_laws::errno_proofs::errno_text_is_total_and_nonempty
          # The whole-i32 classifier trio, graduated from the deep job
          # by measurement (night-depth-hardening-4): the structured
          # errno fallthrough (UnknownErrno, render deferred to
          # Display) freed the constructors of the eager format! that
          # burned the wall, and the three proofs now measure
          # 2-26 s locally (cold first run to warm rerun) —
          # fast-lane weight, riding every push instead of the
          # manual dispatch the on-demand era gave them.
          - name: errno-classifiers (the whole-i32 trio)
            args: >-
              --harness engine::kani_laws::errno_proofs::kprobe_open_classifies_the_whole_errno_domain
              --harness engine::kani_laws::errno_proofs::fentry_link_classifies_the_whole_errno_domain
              --harness engine::kani_laws::errno_proofs::link_create_classifies_the_whole_errno_domain
          # The fast singles: proved solo in under three minutes on the
          # first matrix run (they were the victims of the earlier
          # family serialization, not of their own weight).
          - name: privilege-table (the audit polarity)
            args: --harness engine::kani_proofs::proofs::privilege_table_matches_the_audit
          - name: preset-by-index (the whole-u32 resolution)
            args: --harness engine::kani_proofs::proofs::preset_by_index_is_total_and_valid
          - name: pool-mix-net (the NaN-silence law)
            args: --harness engine::kani_proofs::proofs::pool_mix_net_contains_every_voice_and_gain
          - name: envelope-decay (monotone, off absorbing)
            args: --harness engine::kani_proofs::proofs::envelope_decay_is_monotone_and_off_is_absorbing
    # A cap, not a speed claim — and the owner's hard number: twelve
    # minutes per leg, no compromise. The proofs themselves are bounded
    # by construction (the harnesses' own input domains).
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          # night-depth-hardening-3: the checkout token never outlives
          # this step — no later step can read it back (the miri.yml law).
          persist-credentials: false

      - name: Harden the runner DNS
        run: |
          # The zejtron night recipe, adopted for the same fleet (the
          # 43048319555 outage evidence): the public resolvers go IN
          # FRONT of /etc/resolv.conf — appending would fall past
          # glibc's three-slot MAXNS window. This lane needs it for
          # the kani toolchain download.
          {
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'
            sudo cat /etc/resolv.conf
          } | sudo tee /etc/resolv.conf > /dev/null

      - name: Install system dependencies
        run: |
          # The ci.yml apt idiom, hardened whole (night-cafe-mclaren-2):
          # the fast path installs from the image's own lists and never
          # runs `apt-get update` — the v80.5.8 LTS leg died on the
          # runner image's packages.microsoft.com noble repo answering
          # 403 Forbidden ("no longer signed"), which sinks every plain
          # update lane while install-from-lists stays untouched. Only
          # a failed fast path earns the repoint lane, and the update
          # attempts run with the third-party image repos disabled —
          # this lane's payload lives in the ubuntu archive, so a
          # broken extra repo cannot sink it again. alsa-sys's
          # pkg-config probe needs the dev headers before any
          # root-crate compile can start.
          APT_OPTS=(-o Acquire::Retries=5 -o Acquire::http::Timeout=45)
          if sudo timeout 90 apt-get "${APT_OPTS[@]}" install -y -qq \
              libasound2-dev pkg-config; then
            echo "apt: the fast path landed (the image's lists held)"
          else
            echo "apt: fast path failed - repoint azure, drop third-party repos, retry the update lane"
            # The repoint target is not a hardcoded server anymore: the
            # AXP1-ZnQ (Architect's eXecution Protocol 1) resolver walks
            # the repos-for-ci catalog and hands back the first address
            # that actually answers (line 1 down, the lane moves on -
            # line 5 answering is the one the lane uses). Exit 1 with no
            # live address - a dead default is never a fallback.
            MIRROR="$(python3 scripts/dev/axp1znq_resolve.py \
              --file repos-for-ci/apt-mirrors.txt \
              --probe-path dists/noble/InRelease \
              --first)"
            sudo sed -i "s|mirror+file:/etc/apt/apt-mirrors.txt|${MIRROR}/|g" \
              /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sudo sed -i "s|http://azure.archive.ubuntu.com/ubuntu/|${MIRROR}/|g" \
              /etc/apt/sources.list 2>/dev/null || true
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
              \( -name '*.list' -o -name '*.sources' \) \
              ! -iname '*ubuntu*' ! -iname '*archive*' \
              -exec mv -- {} {}.disabled \; 2>/dev/null || true
            landed=""
            for attempt in 1 2 3; do
              echo "--- apt attempt $attempt: update + install ---"
              if sudo timeout 240 apt-get "${APT_OPTS[@]}" update \
                && sudo timeout 600 apt-get "${APT_OPTS[@]}" install -y -qq \
                     libasound2-dev pkg-config; then
                landed="attempt $attempt"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::apt stalled on all three named attempts"
                exit 1
              fi
              sleep 20
            done
            echo "apt: landed on $landed"
          fi

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # night-frontier-Z7 verify: the verifier's install is two network
      # phases — the crates.io shim, then the bundle setup that fetches
      # the toolchain into ~/.kani. The bundle phase is the one that
      # stalled the lane twice (runs 58 and 60 sat past the old 30-minute
      # cap mid-download), and re-paying it on every run is waste. Cache
      # ~/.kani keyed on the pinned Kani version: the download happens
      # once per version, and a hit makes the install a local no-op check
      # (the setup skips an existing compatible bundle). Same cache idiom
      # and SHA pin as the eBPF prerequisites above.
      - name: Restore the Kani verifier cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.kani
          key: kani-verifier-0.68.0-${{ runner.os }}-${{ runner.arch }}

      # v1.1, night-depth-hardening-2 SHA pin (the line-length law keeps
      # the long-form comment above the use; the bare "# v1.1" token
      # rides the pin line itself so the actions-pin health sweep
      # enlists it — an untokened pin is permanently exempt, and an
      # exempt pin is a contract nobody runs). The version is pinned
      # with the bundle cache above — 'latest' would float under a
      # fixed cache key. The args ride the matrix family: --exact plus
      # the family's fully qualified harness names, so each leg proves
      # exactly its own laws and nothing else (the multi-filter
      # semantics are the verifier's own documented contract: one
      # --harness flag per harness).
      - name: Install the Kani verifier and prove the family
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f  # v1.1
        with:
          kani-version: '0.68.0'
          args: --output-format terse --exact ${{ matrix.family.args }}

  # night-frontier-Z7 verify: the deep legs, once the atomic five.
  # The first matrix run measured the five as atomic proofs that
  # exceed the twelve-minute push gate: each whole-i32 classifier ran
  # past that cap alone, the verifier-log tail bound ran out of
  # memory at the four-gigabyte mark, and the cmdline matcher's five
  # byte roles outweighed the cap. night-depth-hardening-4 then
  # landed the reshaping in THREE rounds of measured forensics: the
  # classifier trio's eager errno render moved to Display (the legs
  # measure 26/3/2 s and now ride the fast lane's errno-classifiers
  # family above), and the tail and cmdline legs traced to intrinsic
  # memory bombs in the string-walking BODIES themselves —
  # str::lines() dying at 90 s on a seven-byte fully concrete probe,
  # the split-and-filter iterator dying at 300 s on an eight-byte
  # probe with one symbolic byte, the 121-character cap probe dying
  # at 778 s even after the char-boundary slice. The flattened
  # manual-scan bodies carry the same laws at 12/9/7 s measured
  # locally (the harness docs and the bodies' own notes record every
  # number), so the deep job rides push like every other lane — the
  # night-fly-1 on-demand gate is retired, nothing skips, and the
  # fifteen-minute cap below stands as headroom: a leg that
  # outmeasures it goes red as the honest signal that a reshape
  # regressed.
  deep:
    name: deep proof ${{ matrix.harness.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harness:
          - name: cmdline-tamper (the whole single-flip space)
            args: --harness engine::kani_proofs::proofs::cmdline_tamper_breaks_the_real_player_shape
          - name: verifier-tail keep bound (the line count)
            args: --harness engine::kani_laws::errno_proofs::verifier_tail_keeps_at_most_the_keep_bound
          - name: verifier-tail cap boundary (the cut mechanism)
            args: --harness engine::kani_laws::errno_proofs::verifier_tail_caps_every_line_at_the_bound
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          persist-credentials: false

      - name: Harden the runner DNS
        run: |
          # The same recipe the fast lane carries (the public resolvers
          # in front of resolv.conf for the toolchain download).
          {
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'
            sudo cat /etc/resolv.conf
          } | sudo tee /etc/resolv.conf > /dev/null

      - name: Install system dependencies
        run: |
          # The same hardened idiom as the first seat above — the fast
          # path installs from the image's own lists (the v80.5.8 leg
          # watched the runner image's packages.microsoft.com noble
          # repo answer 403 "no longer signed" to every plain update),
          # the fallback disables the third-party repos it does not
          # need, and only the ubuntu archive carries the payload.
          APT_OPTS=(-o Acquire::Retries=5 -o Acquire::http::Timeout=45)
          if sudo timeout 90 apt-get "${APT_OPTS[@]}" install -y -qq \
              libasound2-dev pkg-config; then
            echo "apt: the fast path landed (the image's lists held)"
          else
            echo "apt: fast path failed - repoint azure, drop third-party repos, retry the update lane"
            # The repoint target is not a hardcoded server anymore: the
            # AXP1-ZnQ (Architect's eXecution Protocol 1) resolver walks
            # the repos-for-ci catalog and hands back the first address
            # that actually answers (line 1 down, the lane moves on -
            # line 5 answering is the one the lane uses). Exit 1 with no
            # live address - a dead default is never a fallback.
            MIRROR="$(python3 scripts/dev/axp1znq_resolve.py \
              --file repos-for-ci/apt-mirrors.txt \
              --probe-path dists/noble/InRelease \
              --first)"
            sudo sed -i "s|mirror+file:/etc/apt/apt-mirrors.txt|${MIRROR}/|g" \
              /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sudo sed -i "s|http://azure.archive.ubuntu.com/ubuntu/|${MIRROR}/|g" \
              /etc/apt/sources.list 2>/dev/null || true
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
              \( -name '*.list' -o -name '*.sources' \) \
              ! -iname '*ubuntu*' ! -iname '*archive*' \
              -exec mv -- {} {}.disabled \; 2>/dev/null || true
            landed=""
            for attempt in 1 2 3; do
              echo "--- apt attempt $attempt: update + install ---"
              if sudo timeout 240 apt-get "${APT_OPTS[@]}" update \
                && sudo timeout 600 apt-get "${APT_OPTS[@]}" install -y -qq \
                     libasound2-dev pkg-config; then
                landed="attempt $attempt"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::apt stalled on all three named attempts"
                exit 1
              fi
              sleep 20
            done
            echo "apt: landed on $landed"
          fi

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore the Kani verifier cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.kani
          key: kani-verifier-0.68.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Kani verifier and prove the atomic law
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f  # v1.1
        with:
          kani-version: '0.68.0'
          args: --output-format terse --exact ${{ matrix.harness.args }}
