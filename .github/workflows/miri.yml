# =============================================================================
# Dragon Guard - Miri — undefined-behavior verification of the pure-Rust core
# =============================================================================
#
# The runner contract (night-dragon-maintenance-1, the sibling zejtron's
# mature shape ported to this estate): the scope logic lives in the
# repo (scripts/lib/miri.sh, dispatched by ./scripts/build.sh miri),
# and this workflow only installs the toolchain and calls it with
# --no-install — one implementation, two surfaces: a contributor runs
# the same command locally, and the stamp file contract
# (target/miri-stamp) means CI's verdict and the local banner read
# from the same source of truth.
#
# Scope: the audited pure families (MIRI_AUDIT_MODULES in
# scripts/lib/miri.sh) — the string/math/logic core (the Hinnant clock
# lanes, the config parser/validator, the preset tuning tables, the
# engine pool math, the CLI contracts) where an unsafe-adjacent
# refactor would first lie. The admission law lives with the list: a
# test that full-text scans README/CHANGELOG, burns an unbounded
# numeric/render loop, or calls the foreign libc/kernel ABI must
# never enter the families without #[cfg_attr(miri, ignore =
# "reason")] — it keeps running NATIVELY in every other lane (ci.yml's
# cargo test and the Supermassive VM battery own the docs assertions,
# the math loops, and the kernel surface).
#
# The incident record (night-dinner-6, this estate): a miri run hung
# past 30 minutes with 93% of its wall clock inside FIVE tests — the
# two freeze doc-assertions (whose full-text scans of README/CHANGELOG
# cost ~23 minutes interpreted, the changelog one alone ~20) and the
# three sample-loop render tests (~6 minutes of pure float work). All
# five carry the ignore attribute today (verified 2026-10-26 against
# the tree); the audited-families default is the structural guard —
# a future burden test that slips past the admission law dies loudly
# inside the fail-fast cap below instead of hanging the runner.
#
# The push and pull_request triggers STAY (the owner's contract is a
# fast UB net on every code push, not an absent one): UNFILTERED since
# night-dragon-maintenance-2 (the owner's unfiltered-CI
# simplification — no path filter, no branch filter, the same blind
# posture every push-triggered lane in the estate now carries; the
# surface globs' sync tax cost more than the runner minutes they
# saved), the Sunday sweep (00:00 UTC / 07:00 WIB) keeps the weekly
# full-net tick, and workflow_dispatch is the on-demand deep check.
#
# Deliberately NO RUSTFLAGS=-D warnings here: the miri build is not
# the warning-gated lane (ci.yml owns that contract), and pinning
# warnings on the interpreter build would couple two unrelated
# policies.

name: Dragon Guard - Miri

on:
  push:
  pull_request:
  schedule:
    # Sunday 00:00 UTC (07:00 WIB) — picks up the week's commits in
    # one shot, the zelynic cadence.
    - cron: "0 0 * * 0"
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# Rapid pushes to the same ref cancel the superseded run instead of
# queueing a duplicate miri build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  miri:
    name: Miri UB verification (the audited pure families)
    runs-on: ubuntu-24.04
    # night-dinner-6: a fail-fast cap, not a speed claim — the scoped
    # suite lands in ~4 minutes on the measured record; 20 gives 5x
    # headroom before a runaway interpreted run burns the runner.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, the zelynic estate SHA pin

      # The moving `nightly` tag with the miri component — the
      # interpreter build rides nightly by construction; the
      # rust-toolchain.toml stable pin stays the shipping contract and
      # is NOT overridden for the normal lanes.
      - name: Install nightly + miri
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, the zelynic estate SHA pin
        with:
          toolchain: nightly
          components: miri

      # The workspace links the C audio stack (alsa) even though no
      # test exercises the device — the build needs the dev headers or
      # alsa-sys's pkg-config probe fails before miri can interpret a
      # single test. The capture-side headers (libinput, udev) died
      # with the daemon-era seat capture (night-improve-23).
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev pkg-config

      # night-improve-24: the default `ebpf` feature makes every root
      # build embed the kernel object through the prebuilt lane, whose
      # preflight hard-requires the dated nightly pin and bpf-linker —
      # the moving `nightly` above does not satisfy it (that mismatch
      # was the 55-second red Miri run). The bootstrap is the
      # canonical installer; the ebpf/target cache is shared with the
      # ci.yml check and ebpf lanes.
      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, the zelynic estate SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, the zelynic estate SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            miri-

      # The interpreted run: the audited pure families under miri's
      # engine, through the same runner a contributor uses locally.
      # --no-install is the CI contract: the pinned toolchain above is
      # the only nightly this lane may ride, so a missing component
      # must fail loudly rather than silently download a moving one.
      - name: Run Miri (scripts/build.sh miri --no-install)
        run: |
          ./scripts/build.sh miri --no-install

      # The failure evidence outlives the runner: the interpreted log
      # (which test, which allocation, which borrow).
      - name: Upload Miri log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7, the zelynic estate SHA pin
        with:
          name: miri-log
          path: target/miri-log.txt
          retention-days: 30
