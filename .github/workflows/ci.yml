---
name: Dragon Guard - CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.detect.outputs.core }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin
        with:
          fetch-depth: 0
      - name: Detect core file changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
            HEAD="${{ github.sha }}"
          fi
          FILES=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git ls-files)
          PATTERN='\.(rs|toml)$|Cargo\.lock$|^build\.rs$|^rust-toolchain|^scripts/|^\.cargo/|^\.github/'
          if echo "$FILES" | grep -qE "$PATTERN"; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin

      # night-improve-24: since the eBPF-only turn (night-improve-23) the
      # default `ebpf` feature embeds the kernel object from a git checkout
      # via the source-built lane — build.rs preflight hard-requires the
      # dated nightly pin and bpf-linker, and panics with their exact
      # one-command fix otherwise. The bootstrap is the canonical installer
      # (idempotent, reads both pins from their repo files). The hardware
      # capture stack (libinput, udev) died with the daemon: only the cpal
      # ALSA headers remain a build prerequisite.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev pkg-config

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

  # night-improve-24: the kernel-side lane. The tap is a detached
  # workspace on its own dated nightly (ebpf/rust-toolchain.toml),
  # cross-compiled to bpfel-unknown-none with -Z build-std=core and
  # linked by bpf-linker. The check job proves the EMBEDDING half (the
  # root crate building with the object staged into the binary); this
  # lane proves the KERNEL half standalone: formatting, the release
  # build with the committed lock, and the ELF structure aya's loader
  # demands (night-badas-4: the tap's program sections are
  # fentry/input_event and kprobe/input_event — the night-improve-25
  # chain — plus the maps and license sections; the old "tracepoint"
  # expectation described a tap shape this crate never shipped and
  # failed every run since its introduction). No system packages:
  # aya-ebpf is pure Rust and the object needs no host headers.
  ebpf:
    name: eBPF tap build
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check eBPF crate formatting
        run: cargo fmt --all -- --check
        working-directory: ebpf

      - name: Build the tap (bpfel-unknown-none, build-std core)
        run: cargo build --release --locked
        working-directory: ebpf

      - name: Validate the ELF object structure
        run: |
          set -euo pipefail
          OBJECT="ebpf/target/bpfel-unknown-none/release/zylaxion-tap"
          test -s "$OBJECT" || {
            echo "FAIL: the tap object is absent at $OBJECT — the build above claims success;"
            echo "listing what cargo actually produced under ebpf/target:"
            find ebpf/target -maxdepth 3 -name 'zylaxion*' 2>/dev/null || true
            exit 1
          }
          MAGIC=$(dd if="$OBJECT" bs=1 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')
          test "$MAGIC" = "7f454c46" || {
            echo "FAIL: $OBJECT is not ELF (magic: $MAGIC)"
            exit 1
          }
          SECTIONS=$(readelf -S "$OBJECT")
          echo "$SECTIONS" | grep -qw maps || {
            echo "FAIL: no maps section — the pinned state store would have nowhere to live"; echo "$SECTIONS"; exit 1
          }
          echo "$SECTIONS" | grep -qw license || {
            echo "FAIL: no license section — the loader would refuse the program"; echo "$SECTIONS"; exit 1
          }
          # night-badas-4: the program section is the night-improve-25
          # chain's shape — fentry/input_event (the BTF lane) or
          # kprobe/input_event (the fallback), never "tracepoint".
          echo "$SECTIONS" | grep -qE 'fentry/input_event|kprobe/input_event' || {
            echo "FAIL: no program section on input_event — the tap cannot attach"
            echo "$SECTIONS"
            exit 1
          }
          echo "eBPF object structural validation: OK"

  workflow_quality:
    name: Workflow lint + codespell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin

      - name: Install workflow lint tools
        run: |
          python3 -m pip install --user yamllint codespell
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

      - name: Run yamllint
        run: yamllint .github/workflows

      - name: Run codespell
        run: |
          if [ -f .codespellrc ]; then
            codespell --config .codespellrc .
          else
            codespell --skip './.git,./target,./assets,./dist,./node_modules' .
          fi

  # v10.2.0 (dragonzen audit I5): supply-chain CVE scan via cargo-audit.
  # Runs weekly (Mon 07:00 UTC) AND on every push/PR that touches Cargo.lock
  # or any Cargo.toml. The local gatekeeper skips cargo-audit per policy —
  # this job is the canonical source for vulnerability scanning.
  audit:
    name: Supply-chain CVE scan
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings
