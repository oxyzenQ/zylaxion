# =============================================================================
# CI Pipeline — the code-push build estate
# =============================================================================
#
# night-badas-6 (the zelynic NIGHT-improve-13 + boost-10 doctrine): the
# `paths:` filter is the single trigger gate — the former `changes` job
# (a full fetch-depth: 0 clone plus a git-diff regex re-implementing
# what GitHub's native path filter already knows) is gone. Every push
# to main spent a depth-0 clone detecting what the event itself
# carries; now the filter costs nothing and the estate reads one
# spelling: the shared surface globs — '**/*.rs', '**/*.toml',
# '**/Cargo.lock', '.cargo/**', 'ebpf/**', 'scripts/**' — plus this
# file's own name (the hunt-34 law: a workflow that can change its own
# contract owes itself a run). The same spelling on pull_request (the
# no-drift law).
#
# Coverage facts (the zelynic boost-10 header, sized to zylaxion):
# '**/*.rs' spans src/, ebpf/, test/, and build.rs; '**/*.toml' spans
# both Cargo manifests, the root cargo config, and both toolchain
# pins; '**/Cargo.lock' spans the root and ebpf locks; 'ebpf/**' keeps
# the target-spec JSON no extension glob reaches; 'scripts/**' is ONE
# directory glob (the boost-9 one-glob law — never a list of script
# filenames; every new script a lane consumes is covered on landing).
#
# A docs-only change matches nothing here: the wholesale non-code
# gates live in gate-keepers.yml, which runs on EVERY push unfiltered —
# a docs-only change never skips the gates that police it, and this
# workflow buys zero minutes on a docs-only push. The supply-chain
# scan lives in audit.yml (the scanner rule: a scanner workflow
# carries the surface it scans — manifests and locks, plus the weekly
# advisory-DB clock).
#
# The former "Workflow lint + codespell" job moved to gate-keepers.yml
# (night-badas-6): under this file's path-filtered shape a
# workflow-file-only change matched no glob and skipped the very gates
# that could catch it; the unfiltered wholesale home closes that hole.
#
# Toolchain: no rustup override anywhere — rust-toolchain.toml's pin
# governs every cargo invocation, so every lane tests the exact
# toolchain the MSRV contract promises.
#
# Action pins: release-commit SHAs with version tokens, the
# night-improve-8 estate — kept current by
# scripts/gates/check-actions-pins.sh.

---
name: Dragon Guard - CI

"on":
  push:
    branches: [main]
    paths:
      # night-badas-6: the estate-wide trigger spelling (the zelynic
      # boost-10 one-spelling law) — the shared surface globs plus
      # this file's own name. A docs-only change matches nothing here.
      - '**/*.rs'
      - '**/*.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - 'ebpf/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      # Same spelling as push (the no-drift law).
      - '**/*.rs'
      - '**/*.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - 'ebpf/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Rapid pushes to the same ref cancel the superseded run instead of
# queueing a duplicate full build (the cosmostrix stability pattern
# every push workflow carries).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin

      # night-improve-24: since the eBPF-only turn (night-improve-23) the
      # default `ebpf` feature embeds the kernel object from a git checkout
      # via the source-built lane — build.rs preflight hard-requires the
      # dated nightly pin and bpf-linker, and panics with their exact
      # one-command fix otherwise. The bootstrap is the canonical installer
      # (idempotent, reads both pins from their repo files). The hardware
      # capture stack (libinput, udev) died with the daemon: only the cpal
      # ALSA headers remain a build prerequisite.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev pkg-config

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

  # night-improve-24: the kernel-side lane. The tap is a detached
  # workspace on its own dated nightly (ebpf/rust-toolchain.toml),
  # cross-compiled to bpfel-unknown-none with -Z build-std=core and
  # linked by bpf-linker. The check job proves the EMBEDDING half (the
  # root crate building with the object staged into the binary); this
  # lane proves the KERNEL half standalone: formatting, the release
  # build with the committed lock, and the ELF structure aya's loader
  # demands (night-badas-4: the tap's program sections are
  # fentry/input_event and kprobe/input_event — the night-improve-25
  # chain — plus the maps and license sections; the old "tracepoint"
  # expectation described a tap shape this crate never shipped and
  # failed every run since its introduction). No system packages:
  # aya-ebpf is pure Rust and the object needs no host headers.
  ebpf:
    name: eBPF tap build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check eBPF crate formatting
        run: cargo fmt --all -- --check
        working-directory: ebpf

      - name: Build the tap (bpfel-unknown-none, build-std core)
        run: cargo build --release --locked
        working-directory: ebpf

      - name: Validate the ELF object structure
        run: |
          set -euo pipefail
          OBJECT="ebpf/target/bpfel-unknown-none/release/zylaxion-tap"
          test -s "$OBJECT" || {
            echo "FAIL: the tap object is absent at $OBJECT — the build above claims success;"
            echo "listing what cargo actually produced under ebpf/target:"
            find ebpf/target -maxdepth 3 -name 'zylaxion*' 2>/dev/null || true
            exit 1
          }
          MAGIC=$(dd if="$OBJECT" bs=1 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')
          test "$MAGIC" = "7f454c46" || {
            echo "FAIL: $OBJECT is not ELF (magic: $MAGIC)"
            exit 1
          }
          # -SW: the wide render. Plain -S truncates section names to
          # 17 columns ("fentry/input[...]") and a full-name grep can
          # never match (night-badas-4 round 2: the first green-reaching
          # run caught exactly that).
          SECTIONS=$(readelf -SW "$OBJECT")
          echo "$SECTIONS" | grep -qw maps || {
            echo "FAIL: no maps section — the pinned state store would have nowhere to live"; echo "$SECTIONS"; exit 1
          }
          echo "$SECTIONS" | grep -qw license || {
            echo "FAIL: no license section — the loader would refuse the program"; echo "$SECTIONS"; exit 1
          }
          # night-badas-4: the program section is the night-improve-25
          # chain's shape — fentry/input_event (the BTF lane) or
          # kprobe/input_event (the fallback), never "tracepoint".
          echo "$SECTIONS" | grep -qE 'fentry/input_event|kprobe/input_event' || {
            echo "FAIL: no program section on input_event — the tap cannot attach"
            echo "$SECTIONS"
            exit 1
          }
          echo "eBPF object structural validation: OK"
