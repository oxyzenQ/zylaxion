# =============================================================================
# Dragon Guard - Fuzz — the fuzzer/hacker mode (night-dragon-maintenance-5)
# =============================================================================
#
# The sibling zejtron's mature fuzz lane ported to this estate, on the
# owner's ask: "enable fuzzer/hacker mode for this project, put on CI
# if the owner is lazy on local tests." The lane is the regression
# net that never sleeps: every push re-proves the pure parse surfaces
# survive hostile input, and the weekly deep session buys the depth a
# 60-second net cannot.
#
# Scope: the three std-only pure parse surfaces a hostile host can
# feed - the kernel-release grammar (the floor verdict's input is
# /proc/sys/kernel/osrelease, host-controlled text), the version
# grammar (SemVer parse + the update verdict + the GitHub tag_name
# extraction, payload-controlled text), and the Hinnant civil clock
# (the date math every report's stamps ride). The harnesses
# path-include the exact sources (see fuzz/Cargo.toml): the fuzzer
# compiles the same bytes the binary ships, so a guarantee the lane
# proves is a guarantee the binary carries. The eBPF kernel-side code
# is deliberately not fuzzed - it runs behind the kernel verifier,
# not in userspace.
#
# The include law holds here before anything builds: the three
# included files must stay crate-import-free (no `crate::` paths), or
# the path-include shape would silently rot into a copied grammar.
# The precheck below fails loudly with the offending file.
#
# Nightly is the fuzzer's standard toolchain (cargo-fuzz builds the
# harness with the libFuzzer runtime); the main crate's stable pin in
# rust-toolchain.toml is untouched - the env-var override below is
# scoped to this lane's cargo invocations, including the nested ones
# cargo-fuzz spawns. Each target runs for a bounded 60 seconds per
# push: the lane's job is the regression net (a crash fails CI with
# the input in the log), not exhaustive coverage - depth comes from
# the corpus that accumulates between runs via the cache. A found
# crash is a parser bug: fix the parser to return the named error,
# never the panic.
#
# The committed seed anchors (fuzz/seeds/) carry hand-built inputs -
# the real-world kernel-release shapes, the JSON payloads, the domain
# boundary seconds - that the lane copies into the working corpus
# before every run, so the fuzzer starts inside the parse paths from
# run one instead of spending its budget rediscovering valid input
# byte by byte. The grown corpus still stays out of git
# (fuzz/.gitignore); the seeds are the lane's definition, the same
# law as the targets and the manifests.
#
# The weekly deep session: the same three targets run for 15 minutes
# each every Monday 07:30 WIB (00:30 UTC) - the owner-lazy insurance
# the continuous 60s net cannot buy. The corpus cache restores the
# accumulated corpus under the same restore-keys, so the deep session
# and the push sessions grow one asset; a scheduled run and a push on
# the same ref share the concurrency group, the newer run wins (the
# estate shape).
#
# Deliberately NO RUSTFLAGS=-D warnings here: the fuzz build is not
# the warning-gated lane (ci.yml owns that contract), and the
# libfuzzer runtime's own warnings are not this crate's.

name: Dragon Guard - Fuzz

'on':
  push:
  pull_request:
  schedule:
    # The weekly deep session: Monday 00:30 UTC = 07:30 WIB.
    - cron: "30 0 * * 1"
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# One run per ref: a new push supersedes the previous run's verdict
# (the sibling's concurrency shape, every workflow in the estate).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fuzz:
    # The budget rides the event (the Fuzz step's table): 60s on
    # push and PR, 900s on the weekly deep session.
    name: cargo fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [kernel_release, version_grammar, clock_date]
    env:
      # The fuzzer's toolchain, set by environment rather than by
      # `+nightly` on the command line: cargo-fuzz re-invokes cargo
      # internally, and this is the one override rustup honors through
      # every nested invocation - the repo-root rust-toolchain.toml
      # (the stable pin the main crate's lanes ride) cannot leak into
      # the fuzz build.
      RUSTUP_TOOLCHAIN: nightly

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, the zelynic estate SHA pin
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, the zelynic estate SHA pin

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2, SHA pin
        with:
          # Only the fuzz workspace rides this lane's cache: the
          # harnesses path-include the parser sources, so the root
          # crate (its dependencies, its build script) is never built
          # here at all.
          workspaces: fuzz

      - name: Restore the fuzz corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, the zelynic estate SHA pin
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # The run id keys a fresh save per run; the restore keys
          # pull the latest accumulated corpus from any prior run, so
          # the fuzzer keeps growing where the last one stopped.
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # The include law (the sibling's gate 18, scoped to this lane):
      # the path-included sources must stay crate-import-free or the
      # harness shape rots into a copied grammar. Cheap, loud, and in
      # the one place the includes are consumed.
      - name: "The include law holds (no crate-root paths in included sources)"
        run: |
          set -euo pipefail
          for src in src/session/kernel.rs src/info/version.rs src/info/clock.rs; do
            if grep -n 'crate::' "$src"; then
              echo "FAIL: $src carries crate:: paths - the fuzz include law is broken"
              exit 1
            fi
          done
          echo "OK: all three included sources are crate-import-free"

      # The committed anchors: copied into the corpus AFTER the cache
      # restore, so the seeds ride every session - push or weekly -
      # and land in the cache the run saves. A target without a seeds
      # directory is named honestly; the corpus cache still applies.
      - name: Seed the corpus from the committed anchors
        run: |
          if [ -d "fuzz/seeds/${{ matrix.target }}" ]; then
            mkdir -p "fuzz/corpus/${{ matrix.target }}"
            cp "fuzz/seeds/${{ matrix.target }}"/* "fuzz/corpus/${{ matrix.target }}"/
            echo "seeded $(find "fuzz/seeds/${{ matrix.target }}" -type f | wc -l) committed anchor(s) into the corpus"
          else
            echo "no committed anchors for ${{ matrix.target }} - the corpus cache still applies"
          fi

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz
        run: |
          # The budget table: 60s on every push and pull request (the
          # regression net), 900s on the weekly deep session (the
          # corpus keeps growing between runs either way).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BUDGET=900
          else
            BUDGET=60
          fi
          echo "fuzz budget: ${BUDGET}s (event: ${{ github.event_name }})"
          cargo fuzz run ${{ matrix.target }} \
            -- -max_total_time="${BUDGET}" -rss_limit_mb=4096 -timeout=25
