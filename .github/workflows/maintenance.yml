---
name: Dragon Guard - Dependency Maintenance

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"  # Monday 07:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# night-dragon-lts: the weekly lane now refuses to stack — a scheduled
# run and a dispatch racing the same ref double-push the dep update.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-deps:
    runs-on: ubuntu-latest
    # night-dragon-lts: bounded patience + the write scope lives HERE,
    # on the one job that pushes — the top level stays read-only.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin

      - name: Install system dependencies
        run: |
          # The supermassive apt idiom (retries + connect timeout).
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=45 update -qq
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=45 install -y -qq \
            libasound2-dev pkg-config

      - name: Install Rust toolchain
        run: rustup default stable

      # night-badas-1: the ebpf feature went default in night-improve-23,
      # so the clippy/test steps below build the root crate and
      # hard-require the eBPF source-build prerequisites (the dated
      # nightly pin + bpf-linker) — this lane never had them and died
      # in the build script's preflight after cargo update. The same
      # cache + bootstrap pair as the ci.yml check lane.
      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        run: cargo update

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # night-dragon-lts: --all-features, the same surface ci.yml's
        # clippy lane runs — a feature-gated warning must fail BOTH
        # lanes or the weekly lane lies about what main's bar is.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || \
            git commit -m "chore: weekly dependency update"
          git push
