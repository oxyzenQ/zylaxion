---
name: Dragon Guard - Dependency Maintenance

"on":
  workflow_dispatch:
    # night-supply-1 (the zejtron shape, ported): the scan-only dispatch
    # runs the whole AXP1-ZnQ verdict (the pre-pass, the post-pass and
    # the hard exit) but skips the ship lane — no update, no checks, no
    # commit. The owner's red button: any day of the week, the advisory
    # state of every tracked lockfile, one dispatch, ship nothing.
    inputs:
      scan_only:
        description: "Verdict only - scan the committed tree, ship nothing"
        type: boolean
        default: false
        required: false
  schedule:
    - cron: "0 3 * * 0"  # Sunday 03:00 UTC = 10:00 WIB

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# night-dragon-lts: the weekly lane now refuses to stack — a scheduled
# run and a dispatch racing the same ref double-push the dep update.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-deps:
    runs-on: ubuntu-24.04
    # night-dragon-lts: bounded patience + the write scope lives HERE,
    # on the one job that pushes — the top level stays read-only.
    # Sized above the floor to this lane's measured cold record once
    # the Sunday security sweep rides it (the cargo-audit install plus
    # eight advisory invocations on top of the update lane's cold run):
    # at the fifteen-minute auto-trigger ceiling, not past it (RULES).
    timeout-minutes: 15
    env:
      # The Sunday security sweep's snapshot directory — one job-level
      # home shared by the pre step, the post step, the commit step
      # (reading the security note) and the final verdict step.
      ZYLAXION_SWEEP_DIR: /tmp/zylaxion-security-sweep
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, night-improve-8 SHA pin

      - name: Install system dependencies
        if: inputs.scan_only != true
        run: |
          # The ci.yml apt idiom, hardened whole (night-cafe-mclaren-2 —
          # the same evidence as kani.yml): the fast path installs from
          # the image's own lists (the v80.5.8 leg watched the runner
          # image's packages.microsoft.com noble repo answer 403
          # "no longer signed" to every plain update lane), and the
          # fallback disables the third-party repos — the payload
          # lives in the ubuntu archive only.
          APT_OPTS=(-o Acquire::Retries=5 -o Acquire::http::Timeout=45)
          if sudo timeout 90 apt-get "${APT_OPTS[@]}" install -y -qq \
              libasound2-dev pkg-config; then
            echo "apt: the fast path landed (the image's lists held)"
          else
            echo "apt: the fast path failed - repoint off the azure mirror, disable the third-party repos, then the update lane, three named attempts"
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' \
              /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' \
              /etc/apt/sources.list 2>/dev/null || true
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
              \( -name '*.list' -o -name '*.sources' \) \
              ! -iname '*ubuntu*' ! -iname '*archive*' \
              -exec mv -- {} {}.disabled \; 2>/dev/null || true
            landed=""
            for attempt in 1 2 3; do
              echo "--- apt attempt $attempt: update + install ---"
              if sudo timeout 240 apt-get "${APT_OPTS[@]}" update \
                && sudo timeout 600 apt-get "${APT_OPTS[@]}" install -y -qq \
                     libasound2-dev pkg-config; then
                landed="attempt $attempt"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::apt stalled on all three named attempts"
                exit 1
              fi
              sleep 20
            done
            echo "apt: landed on $landed"
          fi

      - name: Install Rust toolchain
        run: rustup default stable

      # AXP1-ZnQ (night-solid-defense-1) runs the same scanner the
      # canonical lane (audit.yml) runs, over the same four-lock surface
      # (night-zen-1). The scanner version is pinned to the exact CLI
      # contract the sentinel parses (--format json; 0.23 replaced the
      # old bare --json) — a scanner bump is a deliberate move, never an
      # automatic ride, the same law the actionlint pin keeps.
      - name: Install the AXP1-ZnQ scanner (cargo-audit)
        run: cargo install cargo-audit --locked --version 0.23.0

      # night-badas-1: the ebpf feature went default in night-improve-23,
      # so the clippy/test steps below build the root crate and
      # hard-require the eBPF source-build prerequisites (the dated
      # nightly pin + bpf-linker) — this lane never had them and died
      # in the build script's preflight after cargo update. The same
      # cache + bootstrap pair as the ci.yml check lane. The scan-only
      # dispatch skips the ship lane below: no eBPF bootstrap, no
      # checks — the verdict rides the committed tree, plain cargo only.
      - name: Restore the eBPF build prerequisites cache
        if: inputs.scan_only != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, night-improve-8 SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        if: inputs.scan_only != true
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # AXP1-ZnQ (scripts/dev/security-sweep.py), the pre-pass: what the
      # as-committed lane carries BEFORE the refresh touches it. The
      # post-pass diffs against this snapshot to tell the owner's two
      # scenarios apart: a finding the sweep cleared (fixable — the fix
      # ships in this run) and a finding the sweep left behind
      # (unfixable — CALL OWNER). The pre-pass never exits 1 on
      # findings — findings are data here; the final verdict step owns
      # the red. Identity (night-solid-defense-1): every banner,
      # annotation, and summary signs as AXP1-ZnQ, so the Sunday
      # morning report names its watcher.
      - name: AXP1-ZnQ pre-pass (scan the committed lane)
        run: python3 scripts/dev/security-sweep.py pre

      # night-zen-1: every tracked Cargo.lock rides the lane now, not
      # just the root one — the script auto-detects each manifest
      # (root, fuzz/, ebpf/, scripts/audit/harness/) and, when the ebpf
      # tree moves, regenerates the prebuilt lane through its one
      # writer so the parity pin never ships stale. The bootstrap step
      # above provides the regen prerequisites (nightly pin, bpf-linker,
      # b3sum).
      - name: Update dependencies
        if: inputs.scan_only != true
        run: ./scripts/dev/update-deps.sh

      # The AXP1-ZnQ post-pass re-sweeps the swept tree, classifies it
      # against the snapshot and writes the job summary. An advisory an
      # in-range bump cleared is reported as an urgent auto-update (the
      # run stays green — the tree was exposed before the sweep, it is
      # clean now, and without this lane the tree would have carried
      # the advisory for a week); a finding nothing in the requirement
      # set can reach is named CALL THE OWNER with its reason (a
      # patched release exists but is unreachable, or no patched
      # release is published at all). The bar is the canonical lane's
      # bar: remaining warnings (unmaintained, unsound, yanked) count
      # exactly the way --deny warnings counts them in audit.yml, and a
      # scanner that cannot run is a red verdict, never a silent green.
      # This step always exits 0 so the fixable bumps still land below;
      # the verdict step owns the red. (The zejtron reference gates its
      # commit lane on the verdict and ships nothing while red — the
      # deliberate divergence here, the owner's call: fixable bumps
      # land first, the red lands after.)
      - name: AXP1-ZnQ post-pass (classify the swept lane)
        run: python3 scripts/dev/security-sweep.py post

      - name: Check formatting
        if: inputs.scan_only != true
        run: cargo fmt --all -- --check

      - name: Clippy
        if: inputs.scan_only != true
        # night-dragon-lts: --all-features, the same surface ci.yml's
        # clippy lane runs — a feature-gated warning must fail BOTH
        # lanes or the weekly lane lies about what main's bar is.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        if: inputs.scan_only != true
        run: cargo test

      # The verdict lands AFTER the commit: fixable bumps ride the
      # weekly commit even when unfixable findings keep the run red
      # (the owner's contract — commit what can be fixed, then fail
      # hard). When the sweep auto-fixed advisories, the commit body
      # carries the security note the sentinel wrote.
      - name: Commit and push
        if: inputs.scan_only != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          message="chore: weekly dependency update"
          if [ -f "${ZYLAXION_SWEEP_DIR}/commit-note.txt" ]; then
            message="${message}"$'\n\n'"$(cat "${ZYLAXION_SWEEP_DIR}/commit-note.txt")"
          fi
          git commit -m "${message}"
          git push

      # The only exit-1 point of the sweep, `if: always()` so it fires
      # even when clippy or the tests failed above: a missing verdict
      # file (the sweep never ran to completion) is RED, never green.
      - name: The AXP1-ZnQ verdict (call the owner)
        if: always()
        run: python3 scripts/dev/security-sweep.py verdict
