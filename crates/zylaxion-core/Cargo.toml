[package]
name = "zylaxion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Orchestrator that wires input, engine, and output for the zylaxion keyboard acoustic engine"

# night-improve-10: explicit auto-discovery controls, the zelynic
# Pattern-C discipline — a stray tests/ or benches/ directory can
# never silently become a target the gate lane did not vet. Neither
# exists in this crate; in-tree #[cfg(test)] modules are unaffected.
# autoexamples stays default-ON deliberately: this crate ships real
# examples/ targets, already vetted by the gate lane (cargo test
# links every example) — switching it off would retire vetted
# targets, the opposite of the discipline.
autotests = false
autobenches = false

[dependencies]
zactrix-engine = { path = "../zactrix-engine" }
zactrix-profiles = { path = "../zactrix-profiles" }
zylaxion-output = { path = "../zylaxion-output" }
zylaxion-input = { path = "../zylaxion-input" }
crossbeam-channel = "0.5"
ringbuf = "0.4"
arc-swap = "1.7"
# v10.2.0 (dragonzen audit S4): used by the orchestrator heartbeat
# log (debug! at 60s, warn! at 5min of input inactivity).
log = "0.4"