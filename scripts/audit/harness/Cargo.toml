[package]
name = "zactrix-audit"
version = "80.0.1"
edition = "2024"
publish = false

# The headless acoustic audit harness (night-private-research-2xblade,
# Phase 0). A standalone crate so the main zylaxion package carries no
# new dependency and no new build target: the harness compiles the
# engine and profiles module trees in place via #[path] includes and
# adds nothing but `log`, which those trees already require.
#
# It renders every shipped preset through the REAL VoicePool render
# path at 96 kHz and reports four physical movement metrics per preset
# (spectral centroid drift, flatness evolution, modal decay spread,
# attack-tail energy ratio), plus the A/B/C tier classification and
# the Phase 0 gate verdict. No audio device, no network, no daemon.

[dependencies]
log = { version = "0.4", default-features = false }
# PROOF 5 (night-private-research-2xblade-3): the hot-reload driver
# applies the watcher's exact preset mutation, an ArcSwap store on the
# model cell - the same crate and version the main package already
# pins, so the workspace lock gains no new supply-chain surface.
arc-swap = "1.7"

# PROOF 6 (night-private-research-2xblade-3.5): the footprint driver
# runs the REAL production audio stack - CpalSink and the Orchestrator
# run loop - against the sandbox's ALSA null PCM. These three are the
# exact crates the main package already pins (main Cargo.lock: cpal
# 0.18, ringbuf 0.5, crossbeam-channel 0.5); the main package's
# own dependency set gains nothing. The cpal spec rides the main
# package's 0.18 move (night-dinner-10): the #[path]-included audio
# tree speaks the 0.18 API (the SampleRate tuple struct, the by-value
# StreamConfig, the unified Error) - the forgotten 0.15 pin here was
# how the harness lane died silently until the alias law rebuilt it
# (night-dragon-maintenance-3).
cpal = "0.18"
ringbuf = "0.5"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
