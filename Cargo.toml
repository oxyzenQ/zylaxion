# night-improve-21: the cosmic dragon unification. The six-crate
# workspace (zactrix-engine, zactrix-profiles, zylaxion-core,
# zylaxion-input, zylaxion-output, zylaxion) is now ONE package at the
# repo root — the cosmic dragon engine and architecture. The former
# crate boundaries survive as the unified module tree:
#
#   src/engine/    <- zactrix-engine   (the voice pool and its voices)
#   src/profiles/  <- zactrix-profiles (params, model, mechanical, tpt)
#   src/core/      <- zylaxion-core    (the Orchestrator, the dragon's spine)
#   src/input/     <- zylaxion-input   (libinput keyboard capture)
#   src/audio/     <- zylaxion-output  (cpal sink, SPSC ring bridge)
#   src/{cli,commands,daemon,info,output,session}/ <- the former binary crate
#
# One target, one lock graph, one build: the same public surfaces and
# the same behavior, minus the path-dependency ceremony. The version
# contract is untouched (11.0.0 lineage, owner-decided bumps only).

[package]
name = "zylaxion"
version = "80.0.2"
# night-improve-4: edition 2024 across the whole tree so the repo speaks
# one edition (the zelynic lineage). The 2024 floor is Rust 1.85; the
# pinned toolchain below (1.98.1) rides far above it.
edition = "2024"
# night-improve-4: the MSRV contract, pinned to the exact toolchain
# rust-toolchain.toml installs (1.98.1). Bumping either half of the
# pair is a two-file change: this field and that channel — never one
# alone, or the declared floor and the tested floor drift apart.
rust-version = "1.98.1"
license = "GPL-3.0-only"
# night-improve-10: the zelynic author format — one obfuscated contact
# string, family-wide. Keeps the registry-facing author row identical
# across the toolchain while the address itself stays un-spiderable.
authors = ["rezky_nightky (oxyzenQ) <with dot rezky at gmail dot com>"]
repository = "https://github.com/oxyzenQ/zylaxion"
description = "Keyboard sound for Linux, computed in the kernel. A passive eBPF input tap voices every keystroke through pure procedural synthesis — zero samples, zero daemons, zero config files."
build = "build.rs"
# night-improve-4: registry-grade manifest completeness, the zelynic
# package-data pattern. The documentation field is the version-less
# docs.rs base URL so it always tracks the newest hosted build the
# moment the owner publishes to the registry. Keyword and category
# slugs use only live registry buckets: command-line-utilities (the
# primary terminal-binary bucket), multimedia::audio (the DSP engine
# surface), os::linux-apis (the honest bucket for an evdev/libinput,
# Linux-only tool).
documentation = "https://docs.rs/zylaxion"
readme = "README.md"
keywords = ["keyboard", "audio", "sound", "linux", "real-time"]
categories = ["command-line-utilities", "multimedia::audio", "os::linux-apis"]

# night-improve-10: explicit auto-discovery controls, the zelynic
# Pattern-C discipline — a stray tests/ or benches/ directory can
# never silently become a target the gate lane did not vet. Neither
# exists in this package; in-tree #[cfg(test)] modules are unaffected
# by autotests, and the test/ tree is wired by #[path] (Pattern C).
# autoexamples stays default-ON deliberately (the former lib crates'
# contract, carried over by night-improve-21): this package ships the
# same three vetted examples/ targets the gate lane linked before the
# unification — switching it off would retire vetted targets, the
# opposite of the discipline.
autotests = false
autobenches = false

# night-dinner-11: the publish allowlist — include-mode, not
# exclude-mode. An allowlist fails closed (a new top-level file stays
# out of the tarball until it is judged here); an exclude list fails
# open (it ships whatever the author forgot to name). Three lane
# contracts shaped this list:
#
#   1. build/ebpf.rs selects the registry-prebuilt lane precisely
#      when ebpf/Cargo.toml is absent from the extract — cargo's
#      package walk cannot carry a nested package, and the lane is
#      DESIGNED on that absence. ebpf/ is therefore deliberately not
#      listed: its GPL source rides the git checkout and the GitHub
#      release archives, while the tarball carries the
#      maintainer-built object from ebpf-prebuilt/ so a plain
#      `cargo install zylaxion` stays on the stable toolchain.
#   2. Declared targets must not dangle: autoexamples stays on (the
#      contract above), so examples/ rides; the test/ tree is wired
#      by #[path] (Pattern C), so `cargo test` on an extract
#      compiles only with test/ present.
#   3. scripts/ stays out: the one script the build machinery names
#      (scripts/dev/bootstrap-ebpf.sh, in build/ebpf.rs panic
#      guidance) serves the source-built lane, which only exists on
#      a git checkout — a lane the tarball cannot offer anyway.
include = [
    # The build lane: sources, the build script, and its #[path]
    # module (build/ebpf.rs), plus the prebuilt object a registry
    # extract stages verbatim.
    "src/**",
    "build.rs",
    "build/*.rs",
    "ebpf-prebuilt/**",
    # Declared targets and their #[path]-wired test tree.
    "examples/**",
    "test/**",
    # The manifest pair and the toolchain pin (a rustup-driven
    # extract build reproduces the pinned toolchain exactly).
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    # The registry-facing documentation and compliance set (flat
    # docs/ only — the archive/ tree stays a repo lane).
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "TRADEMARK.md",
    "COMMERCIAL_LICENSE.md",
    "CLA.md",
    "QA.md",
    "docs/*.md",
]

[dependencies]
# The unified dependency table — the exact union of the six former
# crate manifests, versions untouched (the owner owns version bumps),
# plus the night-improve-23 addition: the aya userspace loader. Since
# night-dragon-maintenance-0 (the unkillable-ebpf law) aya is a plain
# dependency — no feature gate exists to build the binary without it.
arc-swap = "1.7"
# night-improve-23: the userspace half of the pure-Rust eBPF stack.
# aya 0.14 is the upstream pairing of aya-ebpf 0.2.1 (the ebpf/ crate
# pin — the same pairing the zelynic lineage validated on the same
# bpf-linker 0.11.1 toolchain). Unconditional since
# night-dragon-maintenance-0: every zylaxion build carries the tap.
aya = { version = "0.14" }
clap = { version = "4", features = ["derive"] }
# night-dinner-10: on 0.18 - the dedicated move the night-dinner-9
# comment mapped (zero RustSec advisories against 0.15.x made it a
# sequencing decision, not a security one). What the jump buys on the
# Linux lane: ALSA realtime-priority stream threads plus the
# broken-pipe/timestamp fixes (0.16), the silent try_recover that
# stops libasound's stderr spam (0.17), the no-auto-start contract,
# by-value StreamConfig, the unified Error/ErrorKind and the native
# PipeWire/PulseAudio hosts (0.18). Applied break points, all
# mechanical: SampleRate is a u32 alias (the tuple constructor and the
# .0 reads died), build_output_stream takes the config by value, and
# alsa-sys rides the new pin in lockstep (night-improve-29). 0.19
# next: OutputCallbackInfo merges into CallbackInfo and play()
# deprecates toward start() - mapped here so the next bump starts
# from the same map.
cpal = "0.18"
crossbeam-channel = "0.5"
# night-improve-13: default-features = false — env_logger's default
# "humantime" feature (a misleading name since 0.11.8: it maps to
# `dep:jiff`, not humantime) and the env_filter "regex" feature both go.
# The jiff + regex crate trees (~9 crates in the lock) existed ONLY to
# format log timestamps and enable regex filter syntax — the zelynic
# no-time-crate contract answers both: the timestamps render through
# src/info/clock.rs (Hinnant civil_from_days, std clock), and RUST_LOG keeps
# the standard comma-separated directive syntax (regex syntax was never
# a documented zylaxion surface). auto-color stays: the TTY color
# detection the daemon's journal output relies on.
env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
] }
log = "0.4"
# night-security-1: the audited nix API surface is sys::signal::kill,
# poll::{PollFd, PollFlags, PollTimeout, poll}, unistd::{getpid, geteuid,
# Pid, User::from_name} and errno::Errno. Only signal, poll and user are
# real gates: signal = ["process"] in nix's own feature map, so the
# explicit "process" was a redundant key; errno and the unistd basics
# compile ungated. feature list = exactly the used gates.
# night-dinner-9: re-verified on 0.31 — the same three gates map the
# same surface (signal = ["process"] unchanged, fs/process/ffi stay
# ungated here because the crate reaches them through std::os::unix),
# and 0.30's I/O-safety adoption and PollFd Copy removal never touch
# the audited calls (PollFd::new feeds the array directly; kill's
# Pid/Option<Signal> shape is stable).
nix = { version = "0.31", features = ["signal", "poll", "user"] }
ringbuf = "0.5"
# night-improve-23: libc survives for the raw BPF/perf syscalls in
# src/ebpf/bpf_syscall.rs (the tracepoint link pin lane) — the one
# place the typed API surface of aya cannot reach.
libc = "0.2"
# night-security-1: default-features = false — the default "channel"
# and "iterator" features compile the signal-delivery channel and the
# Signals iterator module trees; this crate uses only flag::register
# and the consts (both ungated), so the default modules are dead
# weight in every build. flag and consts stay available with no
# default features — verified against signal-hook 0.3's lib.rs gates.
# night-dinner-9: re-verified on 0.4 — flag and consts remain ungated,
# the default set is still ["channel", "iterator"], and flag::register
# kept its exact Result<SigId, Error> shape; the only 0.4.0 core break
# (low_level::pipe moving to OwnedFd) is a module this crate never
# touches.
signal-hook = { version = "0.4", default-features = false }
# night-improve-22: the `toml` dependency died with config.toml — the
# preset registry is compile-time data. night-improve-23: serde and
# serde_json died with the daemon IPC (there is no protocol left to
# serialize), and the libinput `input` crate died with the seat capture —
# the kernel-side eBPF tap replaced it.

# night-improve-29: alsa-sys rides the tree as cpal's own pin — the
# same 0.4.0 resolves (night-dinner-10: moved in lockstep from the
# 0.3.1 era with the cpal 0.18 bump; one copy of the native link, zero
# supply-chain surface beyond cpal's own choice). Target-gated to
# Linux because that is where cpal's ALSA host lives. The ONE use: the quiet-ALSA probe guard in
# src/commands/info.rs — libasound's C-level error log (up to eight
# raw `ALSA lib ...` lines on a cardless host) cannot spew across the
# rendered CLI surfaces; the guard restores the library default on
# drop so the player path keeps its full diagnosis.
[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.4.0"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = false
incremental = false

# night-improve-11: native-CPU host build profile backing the
# `cargo pro-native-gnu` alias (.cargo/config.toml [alias]). Inherits
# release unchanged — the alias injects -C target-cpu=native, so the
# binary is the same optimization tier as the release package, tuned
# to the build host. Own profile dir keeps the artifact in
# target/pro-native-gnu/, never clobbering target/release/.
[profile.pro-native-gnu]
inherits = "release"

# night-improve-12c: arch-baseline release profiles backing the
# `cargo pro-linux-amd64-v3-gnu` / `pro-linux-amd64-v4-gnu` aliases.
# Inherits release unchanged — the alias injects -C target-cpu and the
# ZYLAXION_BUILD label; the optimization tier is the release contract
# the release.yml matrix ships. Own profile dirs keep the artifacts in
# target/pro-linux-amd64-v3-gnu/ and target/pro-linux-amd64-v4-gnu/,
# never clobbering each other or target/release/.
[profile.pro-linux-amd64-v3-gnu]
inherits = "release"

[profile.pro-linux-amd64-v4-gnu]
inherits = "release"

# No [features] table since night-dragon-maintenance-0 (the zejtron
# unkillable-ebpf law): aya is a plain dependency, there is no build
# flag that can produce a dormant binary. On a git checkout the loader
# embeds the source-built object (the nested nightly build build.rs
# drives); on a registry tarball it embeds the maintainer-built object
# staged from ebpf-prebuilt/ (manifest-verified) - either way the
# install needs NO nightly toolchain and no bpf-linker on the target
# machine. The doctor reports the lane honestly in every build.
