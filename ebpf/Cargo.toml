# The pure-Rust eBPF crate (night-improve-23; night-improve-25 restores
# the approved plan): ONE binary, the tap.
#
# zylaxion-tap — a passive kernel-side probe on the exported
# input_event() function (fentry when vmlinux BTF is present, kprobe
# otherwise) that gates keyboard events against pinned maps and
# publishes presses and releases to a pinned ring buffer. It is the
# entire kernel side of the daemonless architecture: the tap is
# passive (no evdev grab, no /dev/input access, no udev rules), the
# control plane lives in the pinned maps the userspace loader opens by
# name, and the player is woken only for mapped keys while the sound
# is enabled.
#
# The crate is a DETACHED WORKSPACE on purpose (the zelynic
# discipline): the empty [workspace] table keeps it outside the root
# package's build graph, so the default stable-toolchain build
# (build.sh check-all, the gatekeepers) never enters the nightly
# path. The toolchain comes from THIS directory's rust-toolchain.toml
# (the dated nightly pin); any cargo with cwd inside ebpf/ resolves
# it automatically. Direct build:
#
#   cd ebpf && cargo build --release
#
# The version mirrors the ROOT crate's version on purpose (the
# zelynic provenance law): the object ships inside the binary, so a
# drifting version label would be a provenance hole. The bump is
# owner-owned like every other version field.

[package]
name = "zylaxion-ebpf"
version = "80.0.0-rc.2"
edition = "2024"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/oxyzenQ/zylaxion"
description = "Pure-Rust eBPF tap (fentry/kprobe on input_event) for zylaxion, cross-compiled with aya-ebpf and embedded by the userspace loader."

[dependencies]
aya-ebpf = "0.2.1"

[[bin]]
name = "zylaxion-tap"
path = "src/main.rs"

[workspace]
