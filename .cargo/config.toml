# zylaxion cargo configuration — the zelynic alias lineage, the
# night-dragon-maintenance-T1 label grammar (the owner's pro- family
# naming law; glibc is the only libc any alias targets).
#
# Alias grammar: every build path starts from "pro-", shaped
# pro-(os)-(arch)-(cpu)-libc. The live shapes:
#
#   pro-native-gnu            host CPU, dynamic glibc (desktop dev)
#   pro-linux-amd64-gnu       portable x86_64 baseline, dynamic glibc
#   pro-linux-amd64-v3-gnu    x86-64-v3 tier, dynamic glibc
#   pro-linux-amd64-v4-gnu    x86-64-v4 tier, dynamic glibc
#
# The Build: label contract (`zylaxion -V`, the doctor's Variant fact):
#
#   - a LOCAL alias build stamps ZYLAXION_BUILD="local-pro-<shape>"
#     (the --config env line below), so -V reads
#     `Build: local-pro-native-gnu (...)` — the local- marker says
#     "compiled on this machine, not a downloaded release";
#   - a release/CI build stamps ZYLAXION_BUILD="pro-<shape>"
#     (release.yml exports pro-<matrix platform>), so a downloaded
#     artifact reads `Build: pro-linux-amd64-v3-gnu (...)`;
#   - a plain `cargo build --release` sets no env — src/info/build.rs
#     falls back to the compile-time detection and prefixes local-
#     itself: `Build: local-linux-amd64-gnu (...)` (or
#     local-linux-amd64-musl under a musl target).
#
# zylaxion ships glibc as its ONLY libc shape (release.yml, dynamic
# against the system's libasound). The former static musl server lane
# was removed by owner call (night-dragon-maintenance-T1): a musl
# cross-build from a glibc host welds glibc's libasound onto a musl
# CRT — a binary that links but cannot run — and the static story was
# partial anyway (libasound still dlopens its PCM plugin tree at
# runtime), so the lane was deleted rather than left as a trap.
#
# No file-level rustflags, and no [target.*] rustflags table either:
# [profile.release] already pins codegen-units = 1, and every alias
# carries its -C tokens as per-invocation --config build.rustflags
# overrides (a global [build] mutation would leak into plain `cargo
# build`). The zelynic target-level shadow trap (target.rustflags
# silently ignoring build.rustflags) cannot fire here by
# construction — this file defines no [target.*] rustflags.
#
# Backing profiles live in the workspace root Cargo.toml
# ([profile.pro-native-gnu] and the [profile.pro-linux-amd64-*]
# blocks) — each inherits [profile.release]
# unchanged, so every alias binary is the release optimization tier
# and lands in its own target/ directory, never clobbering another.
[alias]
# Host-CPU native glibc build (the zelynic pro-native lineage).
# Compiles for the exact host CPU (-C target-cpu=native), dynamic
# linking, full release optimization tier. Lands in
# target/pro-native-gnu/zylaxion (own profile dir — a native build
# never clobbers target/release/zylaxion).
pro-native-gnu = [
  "build",
  "--profile",
  "pro-native-gnu",
  "--config",
  "env.ZYLAXION_BUILD=\"local-pro-native-gnu\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=native\",\"-C\",\"link-arg=-Wl,-z,now\"]",
]

# The portable baseline gnu shape (no CPU floor): the release
# optimization tier on the shipping triple, runnable on every
# x86_64 host. One named command per the build-from-source law
# (night-dragon-maintenance-3): every script that builds the product
# rides a parity-checked alias — never a bare `cargo build --release`.
# With --target the binary lands in
# target/x86_64-unknown-linux-gnu/release/zylaxion, isolated from any
# host-default build in target/release/.
pro-linux-amd64-gnu = [
  "build",
  "--release",
  "--target",
  "x86_64-unknown-linux-gnu",
  "--config",
  "env.ZYLAXION_BUILD=\"local-pro-linux-amd64-gnu\"",
]

# ── the arch-baseline release aliases (night-improve-12c, the zelynic
#    pro-linux lineage) ─────────────────────────────────────────────────
#
# Owner contract: `cargo pro-linux-amd64-v3-gnu` / `pro-linux-amd64-v4-gnu`
# compile the EXACT release shapes release.yml ships (the two gnu legs,
# the only legs the matrix has). Each alias
# carries its own profile so the two artifacts land in separate target
# dirs and never clobber each other or target/release/zylaxion, and a
# ZYLAXION_BUILD label under the local- marker — the same stamp
# build.rs forwards into the Build: line, so a locally built artifact
# self-reports with the pro- family id the release one carries
# (local-pro-linux-amd64-v3-gnu vs the release pro-linux-amd64-v3-gnu).
#
# The rustflags ride via --config build.rustflags (a per-invocation
# override, never a global [build] mutation — plain `cargo build` stays
# untouched). The -D warnings lint token is deliberately OUT of the
# alias (a local build has no business failing on warnings); the parity
# contract between these aliases and the release matrix is held by
# scripts/gates/check-release-parity.sh, which compares the full -C
# token set — the codegen tokens AND the full-RELRO hardening token
# (-Wl,-z,now: GOT resolved eagerly, mapped read-only before main;
# the glibc dynamic-binary hardening posture the release legs ship).
pro-linux-amd64-v3-gnu = [
  "build",
  "--profile",
  "pro-linux-amd64-v3-gnu",
  "--target",
  "x86_64-unknown-linux-gnu",
  "--config",
  "env.ZYLAXION_BUILD=\"local-pro-linux-amd64-v3-gnu\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=x86-64-v3\",\"-C\",\"link-arg=-Wl,-z,now\"]",
]
pro-linux-amd64-v4-gnu = [
  "build",
  "--profile",
  "pro-linux-amd64-v4-gnu",
  "--target",
  "x86_64-unknown-linux-gnu",
  "--config",
  "env.ZYLAXION_BUILD=\"local-pro-linux-amd64-v4-gnu\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=x86-64-v4\",\"-C\",\"link-arg=-Wl,-z,now\"]",
]

# The zactrix audit harness (scripts/audit/harness — the standalone
# measurement crate; the main package gains no dependency and no new
# build target). The audit scripts build it through this alias so no
# script lane runs a bare `cargo build --release`: the named path is
# the contract, the same law the pro-linux-* aliases serve for the
# product binary. Runs from the repo root — the manifest path is
# repo-relative, like every alias consumer.
pro-audit-harness = [
  "build",
  "--release",
  "--manifest-path",
  "scripts/audit/harness/Cargo.toml",
]
