# zylaxion cargo configuration — the zelynic alias lineage, sized to
# this project's real build shapes (night-improve-11).
#
# zylaxion ships ONE release target: x86_64-unknown-linux-gnu (see
# release.yml — glibc is the only libc the matrix builds, dynamic
# against the system's libasound). The config carries no static-crt
# flags: dynamic glibc IS the shipping shape, by decision.
#
# No build-level rustflags either: [profile.release] already pins
# codegen-units = 1 (the zelynic [build] rustflags exists to force
# that pin onto profiles that lack it; duplicating it here would tax
# every dev build for zero gain). The zelynic target-level shadow
# trap (target.rustflags silently ignoring build.rustflags) has no
# victim here — there are no [target.*] blocks to shadow.
#
# -V naming needs no env stamp: BUILD_TARGET (cli.rs) is cfg-derived
# ("linux-amd64-gnu") and rides every binary, so
# the Build: line names the shape the same way for alias builds as for
# release builds. The zelynic aliases carry env labels only because
# their build.rs overrides the platform id; zylaxion's derives it.
#
# Backing profiles live in the workspace root Cargo.toml:
# [profile.pro-native-gnu] inherits [profile.release] unchanged — the
# only delta is the alias-injected -C target-cpu flag — so alias
# binaries are the same optimization tier as the release package.
[alias]
# Host-CPU native glibc build (the zelynic pro-native lineage).
# Compiles for the exact host CPU (-C target-cpu=native), dynamic
# linking, full release optimization tier. Lands in
# target/pro-native-gnu/zylaxion (own profile dir — a native build
# never clobbers target/release/zylaxion).
#
# Note: cargo aliases cannot detect the host arch — on an aarch64 host
# the alias still builds the host triple fine (dynamic gnu needs no
# target pin); only the name stays amd64-shaped by family convention.
pro-native-gnu = [
  "build",
  "--profile",
  "pro-native-gnu",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=native\",\"-C\",\"link-arg=-Wl,-z,now\"]",
]
# The portable baseline gnu shape (no CPU floor): the release
# optimization tier on the shipping triple, runnable on every
# x86_64 host. One named command per the build-from-source law
# (night-dragon-maintenance-3): every script that builds the product
# rides a parity-checked alias — never a bare `cargo build --release`.
# With --target the
# binary lands in target/x86_64-unknown-linux-gnu/release/zylaxion,
# isolated from any host-default build in target/release/.
pro-linux-amd64-gnu = [
  "build",
  "--release",
  "--target",
  "x86_64-unknown-linux-gnu",
]

# ── the arch-baseline release aliases (night-improve-12c, the zelynic
#    pro-linux lineage) ─────────────────────────────────────────────────
#
# Owner contract: `cargo pro-linux-amd64-v3-gnu` / `pro-linux-amd64-v4-gnu`
# compile the EXACT release shapes release.yml ships (the two gnu legs,
# the only legs the matrix has). Each alias
# carries its own profile so the two artifacts land in separate target
# dirs and never clobber each other or target/release/zylaxion, and a
# ZYLAXION_BUILD label that is the platform id under the `local-`
# marker — the same stamp build.rs forwards into the Build: line, so a
# locally built artifact self-reports exactly like the release one.
#
# The rustflags ride via --config build.rustflags (a per-invocation
# override, never a global [build] mutation — plain `cargo build` stays
# untouched). The -D warnings lint token is deliberately OUT of the
# alias (a local build has no business failing on warnings); the parity
# contract between these aliases and the release matrix is held by
# scripts/gates/check-release-parity.sh, which compares the full -C
# token set — the codegen tokens AND the full-RELRO hardening token
# (-Wl,-z,now: GOT resolved eagerly, mapped read-only before main;
# the glibc dynamic-binary hardening posture the release legs ship).
pro-linux-amd64-v3-gnu = [
  "build",
  "--profile",
  "pro-linux-amd64-v3-gnu",
  "--target",
  "x86_64-unknown-linux-gnu",
  "--config",
  "env.ZYLAXION_BUILD=\"local-linux-amd64-v3-gnu\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=x86-64-v3\",\"-C\",\"link-arg=-Wl,-z,now\"]",
]
pro-linux-amd64-v4-gnu = [
  "build",
  "--profile",
  "pro-linux-amd64-v4-gnu",
  "--target",
  "x86_64-unknown-linux-gnu",
  "--config",
  "env.ZYLAXION_BUILD=\"local-linux-amd64-v4-gnu\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=x86-64-v4\",\"-C\",\"link-arg=-Wl,-z,now\"]",
]

# The zactrix audit harness (scripts/audit/harness — the standalone
# measurement crate; the main package gains no dependency and no new
# build target). The audit scripts build it through this alias so no
# script lane runs a bare `cargo build --release`: the named path is
# the contract, the same law the pro-linux-* aliases serve for the
# product binary. Runs from the repo root — the manifest path is
# repo-relative, like every alias consumer.
pro-audit-harness = [
  "build",
  "--release",
  "--manifest-path",
  "scripts/audit/harness/Cargo.toml",
]
